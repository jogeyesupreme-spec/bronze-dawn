<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Bronze Dawn Valley: grow a river settlement from 6000 BC to the Bronze Age Collapse of 1200 BC.">
<title>Bronze Dawn Valley</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Eczar:wght@500;600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Noto+Sans+Cuneiform&display=swap">
<style>
:root {
  /* Layout: a window onto the valley. The painted settlement fills the room; the same inlaid
     lapis-and-gold frame as Bronze Dawn holds the resource frieze, the drawer of tabs and the year-line. */
  color-scheme: dark;
  --ink: #080c1d;          /* bitumen: frame and deepest ground */
  --lapis: #121b42;        /* drawer and cards */
  --lapis-2: #1a285b;      /* raised surfaces */
  --line: #2e4083;         /* inlay seams */
  --shell: #f3ead7;        /* text, shell inlay */
  --muted: #a7aed0;
  --gold: #ecc061;         /* gold leaf: the one accent */
  --bronze: #c48a43;
  --carnelian: #e66a4c;    /* danger */
  --verdigris: #6cc6a7;    /* good */
  --glass: rgba(9, 14, 34, .9);
  --o-player: #ecc061; --o-kesh: #f3ead7; --o-hattu: #e66a4c;
  --o-amurru: #b693e8; --o-dilmun: #56d4c9;
  --font-display: "Eczar", Georgia, "Times New Roman", serif;
  --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --font-cu: "Noto Sans Cuneiform", "Segoe UI Historic", sans-serif;
  --radius: 8px;
  --pane: 400px;
  --grain: none;           /* a painted grain tile, generated at start-up */
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  color: var(--shell);
  background: var(--ink);
  font: 16px/1.45 var(--font-body);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--shell); outline-offset: 2px; }
.cu { font-family: var(--font-cu); line-height: 1; font-weight: 400; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.pos { color: var(--verdigris); }
.neg { color: var(--carnelian); }
.h {
  margin: 0;
  font: 700 .72rem/1.2 var(--font-body);
  text-transform: uppercase;
  letter-spacing: .16em;
  color: var(--muted);
}
kbd {
  font: 700 .78rem/1 var(--font-body);
  padding: 2px 6px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  background: var(--ink);
  color: var(--shell);
}
.grainy { position: relative; isolation: isolate; }
.grainy::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background-image: var(--grain);
  opacity: .07;
  mix-blend-mode: overlay;
  pointer-events: none;
}

/* ---------- the frame ---------- */
.game { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }

/* frieze: crest, resources, buttons */
.topbar {
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 10px 22px;
  padding-block: 8px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(#18234f, #0e1636);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .45);
}
.topbar::after {
  /* shell-and-carnelian triangles, after the Standard of Ur */
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 5px;
  background-color: var(--shell);
  background-image:
    linear-gradient(to bottom right, transparent 50%, var(--carnelian) 50%),
    linear-gradient(to bottom left, transparent 50%, var(--carnelian) 50%);
  background-size: 10px 5px;
  opacity: .9;
}
.crest { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 0 1 auto; }
.seal {
  flex: none;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 1.15rem;
  letter-spacing: -.1em;
  color: var(--gold);
  background: radial-gradient(circle at 35% 30%, #23336f, var(--ink) 75%);
  box-shadow: 0 0 0 2px var(--gold), 0 0 0 4px var(--ink), 0 4px 14px rgba(0, 0, 0, .6);
}
.crest h1 {
  margin: 0;
  font: 700 clamp(1.25rem, 2vw, 1.6rem)/1.05 var(--font-display);
  color: var(--gold);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.crest .sub { margin: 2px 0 0; font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crest .sub b { color: var(--shell); font-weight: 700; }
.res { flex: 1 1 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 4px; min-width: 0; }
.chip {
  display: grid;
  grid-template-columns: auto auto;
  align-items: center;
  column-gap: 7px;
  padding: 3px 9px 3px 7px;
  border: 1px solid transparent;
  border-radius: 6px;
  cursor: help;
  font-variant-numeric: tabular-nums;
}
.chip:hover, .chip:focus-visible { border-color: rgba(236, 192, 97, .45); background: rgba(255, 255, 255, .04); }
.chip .cu { grid-row: span 2; font-size: 1.05rem; letter-spacing: -.12em; color: var(--gold); text-align: center; min-width: 1.3rem; }
.chip .lab { font-size: .6rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); line-height: 1.1; white-space: nowrap; }
.chip .val { font-size: 1.02rem; font-weight: 800; line-height: 1.15; white-space: nowrap; }
.chip .val .muted { font-weight: 500; font-size: .8rem; }
.chip .d { font-size: .76rem; font-weight: 700; }
.chip.warn .lab { color: var(--carnelian); }
.chip.warn { background: rgba(230, 106, 76, .1); }
.chip.metals { grid-template-columns: auto; }
.chip .mv { display: inline-flex; align-items: baseline; gap: 3px; }
.chip .mv + .mv { margin-left: 9px; }
.chip .mv .cu { font-size: .85rem; color: var(--gold); letter-spacing: -.12em; }
.hdr-btns { display: flex; gap: 6px; flex: none; }
.iconbtn[aria-pressed="false"] .wave { opacity: .15; }
.iconbtn {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .03);
  color: var(--shell);
  cursor: pointer;
}
.iconbtn:hover { border-color: var(--gold); color: var(--gold); }
.iconbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn[aria-pressed="false"] { color: var(--muted); }

/* the room: map and drawer */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) auto; min-height: 0; }
.board { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #0a1028; }
#terrain, #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#map { touch-action: manipulation; }
.board::after {
  /* lamplight falling off at the edges of the table */
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 90px 10px rgba(4, 6, 16, .75);
}
.legend {
  position: absolute;
  left: 14px;
  bottom: 12px;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  max-width: calc(100% - 28px);
  padding: 6px 10px;
  border-radius: 6px;
  background: rgba(8, 12, 29, .72);
  font-size: .8rem;
  color: var(--muted);
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; background: var(--oc); display: inline-block; }

/* map overlay drawn over the painted terrain */
.hex { fill: transparent; stroke: rgba(8, 12, 29, .28); stroke-width: 1; }
.tile { cursor: pointer; outline: none; }
.tile:hover .hex { fill: rgba(255, 244, 214, .12); }
.tile:focus-visible .hex { stroke: var(--shell); stroke-width: 2.5; }
.ownfill { fill: var(--oc); fill-opacity: .1; pointer-events: none; }
.ownfill.fresh { animation: claim 1.4s ease-out 1; }
@keyframes claim { 0% { fill-opacity: .55; } 100% { fill-opacity: .1; } }
.border { fill: none; stroke: var(--oc); stroke-width: 3; stroke-linecap: round; pointer-events: none; filter: drop-shadow(0 0 2px rgba(0, 0, 0, .8)); }
.border.war { stroke-dasharray: 5 4; }
.claim { fill: none; stroke: var(--gold); stroke-width: 1.5; stroke-dasharray: 3 4; opacity: .85; pointer-events: none; }
.sel { fill: rgba(255, 244, 214, .1); stroke: var(--gold); stroke-width: 3; pointer-events: none; filter: drop-shadow(0 0 5px rgba(236, 192, 97, .9)); }
.town { pointer-events: none; }
.town .plinth { fill: rgba(5, 8, 18, .55); }
.town .zig { fill: var(--oc); stroke: var(--ink); stroke-width: 1.2; }
.town .hut { fill: #e9d9b5; stroke: var(--ink); stroke-width: .9; }
.impi { stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
.impi-bg { fill: rgba(8, 12, 29, .82); stroke: var(--bronze); stroke-width: 1.2; pointer-events: none; }
.swords { fill: none; stroke: var(--carnelian); stroke-width: 2.4; stroke-linecap: round; pointer-events: none; filter: drop-shadow(0 0 2px #000); }

/* the land card that opens beside a selected hex */
.tilecard {
  position: absolute;
  z-index: 4;
  width: 300px;
  max-height: calc(100% - 24px);
  overflow: auto;
  display: grid;
  gap: 8px;
  padding: 12px 14px;
  background: var(--glass);
  border: 1px solid rgba(236, 192, 97, .5);
  border-radius: 10px;
  box-shadow: 0 14px 40px rgba(0, 0, 0, .6);
  animation: pop .14s ease-out;
}
@keyframes pop { from { transform: scale(.97); opacity: 0; } }
.tilecard p { margin: 0; }
.ti-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; padding-right: 26px; }
.ti-head h3 { margin: 0; font: 600 1.15rem/1.15 var(--font-display); }
.ti-stats { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: .85rem; color: var(--muted); }
.ti-stats b { color: var(--shell); font-variant-numeric: tabular-nums; }
.close {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  line-height: 1;
}
.close:hover { color: var(--shell); border-color: var(--gold); }
.tilecard .item { padding: 8px 0; }
.tilecard .item:last-child { border-bottom: 0; }

/* drawer: pane plus a rail of tabs */
.drawer { display: grid; grid-template-columns: minmax(0, 1fr) 68px; min-height: 0; background: var(--lapis); box-shadow: -8px 0 24px rgba(0, 0, 0, .4); }
.drawer.closed { grid-template-columns: 68px; }
.drawer.closed .panewrap { display: none; }
.panewrap { width: var(--pane); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; border-right: 1px solid var(--line); }
.panehead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.panehead h2 { margin: 0; font: 700 1.3rem/1.1 var(--font-display); color: var(--gold); }
.pane { display: grid; align-content: start; gap: 12px; padding: 14px 16px 24px; overflow-y: auto; overscroll-behavior: contain; }
.pane p { margin: 0; }
.rail { display: flex; flex-direction: column; gap: 2px; padding: 8px 6px; background: linear-gradient(90deg, #0e1636, var(--ink)); overflow-y: auto; }
.tab {
  position: relative;
  display: grid;
  justify-items: center;
  gap: 3px;
  padding: 9px 2px 7px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.tab .cu { font-size: 1.15rem; letter-spacing: -.12em; max-width: 54px; overflow: hidden; white-space: nowrap; }
.tab .lbl { font-size: .62rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.tab:hover { color: var(--shell); background: rgba(255, 255, 255, .04); }
.tab[aria-selected="true"] { color: var(--gold); border-color: rgba(236, 192, 97, .4); background: rgba(236, 192, 97, .08); }
.tab .dot { position: absolute; top: 6px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--carnelian); box-shadow: 0 0 0 2px var(--ink); }

/* ---------- controls ---------- */
.btn {
  font-weight: 800;
  font-size: .9rem;
  color: var(--ink);
  background: linear-gradient(#f3d27f, var(--gold) 45%, var(--bronze));
  border: 1px solid #5a3c14;
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), 0 2px 0 rgba(0, 0, 0, .35);
}
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3); }
.btn:disabled { background: var(--lapis-2); color: var(--muted); border-color: var(--line); cursor: not-allowed; box-shadow: none; }
.btn.ghost { background: transparent; color: var(--shell); border-color: var(--line); box-shadow: none; }
.btn.ghost:hover:not(:disabled) { border-color: var(--gold); }
.btn.ghost:disabled { background: transparent; color: var(--muted); border-color: var(--line); opacity: .55; }
.btn.danger { background: linear-gradient(#f3a088, var(--carnelian)); border-color: #5a1d10; }
.btn.sq { width: 32px; height: 32px; padding: 0; font-size: 1.15rem; line-height: 1; }
.chipbtn {
  font-weight: 800;
  font-size: .82rem;
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 10px;
  cursor: pointer;
}
.chipbtn[aria-pressed="true"] { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.steps, .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.pill {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: .74rem;
  font-weight: 800;
  letter-spacing: .03em;
  border: 1px solid var(--line);
  color: var(--muted);
}
.pill.war { background: var(--carnelian); border-color: var(--carnelian); color: var(--ink); }
.pill.peace { border-color: var(--verdigris); color: var(--verdigris); }
.pill.own { border-color: var(--oc); color: var(--oc); }
.pill.gold { border-color: var(--gold); color: var(--gold); }
.pill.bad { border-color: var(--carnelian); color: var(--carnelian); }

/* ---------- council ---------- */
.glance { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; padding: 12px; background: var(--lapis-2); border-radius: var(--radius); }
.glance div { display: grid; gap: 2px; min-width: 0; }
.glance b { font-size: .98rem; }
.tip { margin: 0; display: grid; grid-template-columns: 1.2rem minmax(0, 1fr); gap: 6px; font-size: .95rem; }
.tip .cu { color: var(--bronze); font-size: .95rem; padding-top: .25em; }
.tip.bad .cu, .tip.bad { color: var(--carnelian); }
.tip.good .cu { color: var(--verdigris); }
.buffs { display: flex; flex-wrap: wrap; gap: 6px; }
.goals { display: grid; gap: 4px; margin: 0; padding: 8px 10px; list-style: none; background: var(--ink); border-radius: 6px; }
.goals li { display: grid; grid-template-columns: 1.1rem minmax(0, 1fr) auto; gap: 6px; font-size: .9rem; align-items: baseline; }
.goals li::before { content: ""; width: 9px; height: 9px; border: 1.5px solid var(--gold); transform: rotate(45deg); align-self: center; justify-self: center; }
.goals li.done::before { background: var(--gold); }
.goals li.done { color: var(--muted); }
.goals .rw { color: var(--muted); font-size: .8rem; white-space: nowrap; }

/* ---------- people ---------- */
.jobs { display: grid; }
.job {
  display: grid;
  grid-template-columns: 2.6rem minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}
.job > .cu { font-size: 1.05rem; letter-spacing: -.12em; color: var(--gold); text-align: center; overflow: hidden; white-space: nowrap; }
.job-txt { display: grid; gap: 1px; min-width: 0; }
.job-txt b { font-size: 1rem; }
.out { font-size: .86rem; font-variant-numeric: tabular-nums; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper .n { min-width: 3.4ch; text-align: center; font-size: 1.05rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.ledger { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 14px; font-size: .92rem; font-variant-numeric: tabular-nums; }
.ledger span:nth-child(even) { text-align: right; }
.ledger .tot { border-top: 1px solid var(--line); padding-top: 4px; font-weight: 800; }

/* ---------- lists ---------- */
.item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 4px 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.item h4 { margin: 0; font: 600 1.02rem/1.2 var(--font-display); }
.item .meta { color: var(--muted); font-size: .88rem; }
.item .note { color: var(--muted); font-size: .84rem; font-style: italic; }
.item .why { color: var(--carnelian); font-size: .84rem; }
.item.locked h4 { color: var(--muted); }
.item.wonder h4 { color: var(--gold); }
.item.built h4::after { content: " ✓"; color: var(--verdigris); }
.count { font-family: var(--font-body); font-size: .84rem; color: var(--muted); font-weight: 500; }
.bar { height: 8px; background: var(--ink); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--bronze), var(--gold)); }
.current, .godbox { display: grid; gap: 6px; padding: 12px; background: var(--lapis-2); border-radius: var(--radius); }
.current h4, .godbox h4 { margin: 0; font: 600 1.15rem/1.2 var(--font-display); }
.godbox { border: 1px solid var(--bronze); }
.godbox h4 { color: var(--gold); }

/* ---------- neighbors and trade ---------- */
.nb { display: grid; gap: 8px; padding: 12px; background: var(--lapis-2); border: 1px solid var(--line); border-radius: var(--radius); }
.nb.gone { opacity: .6; }
.nb.threat { border-color: var(--carnelian); }
.nb-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.nb-head h4 { margin: 0; font: 600 1.1rem/1.2 var(--font-display); }
.sw { width: 12px; height: 12px; border-radius: 3px; background: var(--oc); }
.nb-stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .88rem; color: var(--muted); }
.nb-stats b { color: var(--shell); }
.meter { position: relative; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--carnelian), var(--ink) 50%, var(--verdigris)); }
.meter i { position: absolute; top: -4px; width: 4px; height: 14px; margin-left: -2px; background: var(--shell); border-radius: 2px; }
.nb-acts { display: flex; flex-wrap: wrap; gap: 6px; }
.scroll { overflow-x: auto; }
.trade { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.trade th { text-align: left; font-size: .68rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding: 6px 4px; }
.trade td { padding: 7px 4px; border-top: 1px solid var(--line); vertical-align: middle; }
.trade td .cu { color: var(--gold); margin-right: 4px; }
.trade .acts { display: flex; justify-content: flex-end; gap: 4px; }

/* ---------- chronicle ---------- */
.chron { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.chron li { display: grid; grid-template-columns: 5.2rem minmax(0, 1fr); gap: 8px; font-size: .92rem; }
.chron .yr { color: var(--muted); font-variant-numeric: tabular-nums; }
.chron li.bad { color: var(--carnelian); }
.chron li.good { color: var(--verdigris); }
.chron li.big { color: var(--gold); }
.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px 14px; }
.gloss div { display: flex; align-items: center; gap: 10px; font-size: .88rem; }
.gloss .cu { font-size: 1.3rem; color: var(--gold); min-width: 2.6rem; }
.minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px 16px; }
.mini { position: relative; margin: 0; max-width: 360px; }
.mini figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ctip { position: absolute; top: 22px; padding: 4px 8px; border-radius: 6px; background: var(--ink); border: 1px solid var(--line); font-size: .8rem; pointer-events: none; white-space: nowrap; }
details summary { cursor: pointer; }
.chart { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font: 500 11px var(--font-body); }
.chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ach { display: grid; gap: 6px; }
.ach div { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr); gap: 8px; font-size: .9rem; }
.ach div.locked { color: var(--muted); }
.ach .cu { color: var(--gold); font-size: 1.05rem; }
.ach div.locked .cu { color: var(--line); }
.best { width: 100%; border-collapse: collapse; font-size: .88rem; font-variant-numeric: tabular-nums; }
.best td, .best th { text-align: left; padding: 5px 6px; border-top: 1px solid var(--line); }
.best th { font-size: .68rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); border-top: 0; }
.best td:last-child, .best th:last-child { text-align: right; }

/* ---------- year-line ---------- */
.turnbar {
  position: relative;
  z-index: 3;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) auto;
  align-items: center;
  gap: 18px;
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(#0f1838, var(--ink));
  border-top: 1px solid var(--line);
  box-shadow: 0 -6px 18px rgba(0, 0, 0, .45);
}
.ticker {
  display: grid;
  grid-template-columns: 1.2rem minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 7px 10px;
  border-radius: 8px;
  background: rgba(255, 255, 255, .03);
  border: 1px solid var(--line);
  font-size: .92rem;
  text-align: left;
  cursor: pointer;
}
.ticker:hover { border-color: var(--gold); }
.ticker .cu { color: var(--bronze); }
.ticker.bad .cu, .ticker.bad .txt { color: var(--carnelian); }
.ticker .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticker .more { font-size: .76rem; color: var(--muted); white-space: nowrap; }
.timeline { min-width: 0; display: grid; gap: 6px; }
.tl-labels { display: flex; justify-content: space-between; gap: 10px; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-labels b { color: var(--shell); }
.tl-labels .col { color: var(--carnelian); }
.tl-track { position: relative; height: 6px; background: var(--lapis-2); border-radius: 3px; }
.tl-track > i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--bronze), var(--gold)); transition: width .6s ease; }
.tl-track b { position: absolute; top: -3px; width: 2px; height: 12px; margin-left: -1px; background: var(--muted); border-radius: 1px; }
.tl-track b.next { background: var(--carnelian); }
.endturn {
  display: grid;
  line-height: 1.05;
  text-align: center;
  font: 700 1.15rem/1.05 var(--font-display);
  padding: 10px 26px;
  border-radius: 10px;
}
.endturn small { font: 600 .74rem/1.2 var(--font-body); }

/* ---------- dialogs and toast ---------- */
.modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(5, 8, 20, .78);
}
.card {
  width: min(580px, 100%);
  max-height: calc(100% - 16px);
  overflow: auto;
  display: grid;
  gap: 14px;
  padding: 0 24px 22px;
  background: var(--lapis);
  border: 1px solid var(--bronze);
  border-radius: 14px;
  box-shadow: 0 0 0 4px var(--ink), 0 0 0 5px rgba(236, 192, 97, .35), 0 24px 70px rgba(0, 0, 0, .65);
  animation: rise .2s ease-out;
}
.card p { margin: 0; }
.banner { display: block; width: calc(100% + 48px); height: 150px; margin: 0 -24px; border-radius: 13px 13px 0 0; }
.medal {
  width: 66px;
  height: 66px;
  margin-top: -47px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 1.8rem;
  letter-spacing: -.1em;
  color: var(--gold);
  background: radial-gradient(circle at 35% 30%, #23336f, var(--ink) 75%);
  box-shadow: 0 0 0 2px var(--gold), 0 0 0 5px var(--ink), 0 6px 18px rgba(0, 0, 0, .6);
  overflow: hidden;
}
.card .date { margin: -6px 0 -8px; font: 800 .74rem/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .16em; color: var(--bronze); }
.card h2 { margin: 0; font: 700 1.65rem/1.1 var(--font-display); text-wrap: balance; }
.card h3 { margin: 0; font: 800 .72rem/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .16em; color: var(--muted); }
.card ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 5px; }
.card label { font-weight: 800; }
.card input, .card textarea {
  width: 100%;
  font: inherit;
  color: var(--shell);
  background: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
}
.card textarea { font: 500 .78rem/1.35 ui-monospace, Menlo, Consolas, monospace; min-height: 80px; resize: vertical; word-break: break-all; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px; }
.seg .btn { display: grid; gap: 1px; text-align: left; white-space: normal; padding: 8px 12px; }
.seg .btn[aria-pressed="true"] { outline: 2px solid var(--gold); outline-offset: 1px; color: var(--gold); }
.seg .btn small { font-weight: 500; font-size: .8rem; opacity: .85; }
.choices { display: grid; gap: 8px; }
.choice { display: grid; gap: 2px; text-align: left; padding: 10px 14px; white-space: normal; }
.choice .hint { font-weight: 500; font-size: .85rem; opacity: .85; }
.tests { display: grid; gap: 6px; }
.tests div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 8px 10px; background: var(--ink); border-radius: 6px; }
.rank { font: 600 1.3rem/1.2 var(--font-display); color: var(--gold); }
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 60;
  max-width: calc(100% - 32px);
  padding: 9px 18px;
  background: var(--shell);
  color: var(--ink);
  border-radius: 8px;
  font-weight: 800;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
  pointer-events: none;
  animation: toastIn .2s ease-out;
}
.toast.gold { background: var(--gold); }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
@keyframes toastIn { from { transform: translate(-50%, 8px); opacity: 0; } }

/* ---------- narrower screens ---------- */
@media (max-width: 1600px) {
  .chip .lab { display: none; }
  .chip .cu { grid-row: auto; }
}
@media (max-width: 1180px) {
  :root { --pane: 360px; }
  .turnbar { grid-template-columns: minmax(0, 1fr) auto; }
  .ticker { display: none; }
}
@media (max-width: 860px) {
  html, body { height: auto; }
  .game { display: block; height: auto; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .topbar { flex-wrap: wrap; }
  .crest { flex: 1 1 100%; }
  .hdr-btns { position: absolute; top: 12px; right: max(16px, env(safe-area-inset-right, 0px)); }
  .res { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; }
  .chip { padding: 3px 4px; column-gap: 4px; }
  .chip .val { font-size: .9rem; }
  .chip .val .muted, .chip .d { display: none; }
  .chip.metals { grid-column: span 2; }
  .stage { display: block; }
  .crest { padding-right: 132px; }
  .drawer, .drawer.closed { display: flex; flex-direction: column; }
  .rail { order: -1; }
  [data-act="fold"] { display: none; }
  .board { aspect-ratio: 571 / 386; width: 100%; }
  .legend { display: none; }
  .drawer, .drawer.closed { box-shadow: none; }
  .drawer.closed .panewrap { display: grid; }
  .panewrap { width: auto; border-right: 0; }
  .rail { flex-direction: row; overflow-x: auto; padding: 6px max(16px, env(safe-area-inset-left, 0px)); position: sticky; top: 0; z-index: 2; }
  .tab { flex: 1 0 auto; padding: 6px 8px; }
  .pane { overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .panehead { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tilecard { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: auto; top: auto !important; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); max-height: 55vh; }
  .turnbar { position: fixed; left: 0; right: 0; bottom: 0; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; }
  .tl-labels .edge { display: none; }
  .endturn { padding: 8px 16px; }
  .toast { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  .card, .toast, .tilecard { animation: none; }
  .tl-track > i { transition: none; }
  .ownfill.fresh { animation: none; }
}

/* ---------- the valley ---------- */
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.landstrip {
  position: absolute;
  left: 14px;
  bottom: 12px;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  max-width: calc(100% - 28px);
  padding: 7px 12px;
  border-radius: 8px;
  background: rgba(8, 12, 29, .78);
  font-size: .86rem;
}
.landstrip .land { padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; }
.landstrip .land b { color: var(--gold); }
@media (max-width: 860px) {
  .board { aspect-ratio: 16 / 10; }
  .landstrip { position: static; max-width: none; border-radius: 0; }
}
</style>
</head>
<body>
<div class="game">
  <header class="topbar">
    <div class="crest">
      <div class="seal cu" aria-hidden="true">&#x1208D;</div>
      <div style="min-width:0">
        <h1 id="realmName">The Uruma</h1>
        <p class="sub" id="era"></p>
      </div>
    </div>
    <section class="res" id="res" aria-label="Resources"></section>
    <div class="hdr-btns">

    </div>
  </header>
  <main class="stage">

      <div class="landstrip" id="landstrip"></div>
    </section>
    <aside class="drawer" id="drawer">
      <div class="panewrap grainy">
        <div class="panehead"><h2 id="paneTitle">Council</h2><button class="btn ghost" data-act="fold" title="Fold the drawer away">Fold</button></div>

</div>
<div class="modal" id="modal" hidden>
  <div class="card" id="mCard" role="dialog" aria-modal="true" aria-labelledby="mTitle"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
/* =====================================================================
   Bronze Dawn Valley: the settlement game, 6000 BC to 1200 BC.
   Closer to Pre-Civilization: Bronze Age than the map game: no map to walk,
   four core resources, lands you gain by expedition, and one valley that
   grows on screen as your people build it.
   Sections: 1 data · 2 state · 3 economy · 4 actions · 5 end of turn ·
   6 neighbors · 7 events and history · 8 end of game · 9 painting ·

const LORE = { name: 'Songs of the ancestors', base: 700, step: 350, score: 30 };
const loreCost = () => LORE.base + LORE.step * (S.lore || 0);

// Population changes keep the split between jobs; the idle absorb rounding
function rescalePop(target) {
  target = Math.max(0, R(target));
  const old = S.pop;
  if (old <= 0) { S.pop = target; return; }
  const keys = JOBS.map(j => j.key), f = target / old;
  keys.forEach(k => { S.jobs[k] = Math.floor(S.jobs[k] * f); });
  S.pop = target;
  while (jobTotal() > S.pop) { const k = keys.find(x => S.jobs[x] > 0); S.jobs[k]--; }

/* ---------- 3. Economy ---------- */
function slots() {
  const L = S.lands, o = { farm: 0, wood: 0, stone: 0, house: 0, food: 0, ore: 0, tin: false };
  for (const [k, n] of Object.entries(L)) {
    const d = LANDS[k];
    o.farm += d.farm * n; o.wood += d.wood * n; o.stone += d.stone * n; o.house += d.house * n; o.food += d.food * n;
    o.ore += (d.ore || 0) * n;
    if (d.tin && n) o.tin = true;
  }
  if (has('irrigation')) o.farm += 6 * L.river;
  if (S.b.canal) o.farm += 4 * (L.river + L.plain);
  if (has('boats')) o.food += 4 * L.marsh;
  if (has('sailing') && !S.flags.tinClosed) o.tin = true;
  return o;
}
function calc() {
  const c = {}, j = S.jobs, sl = slots(), d = D();

  const low = S.mood < 15 ? 0.7 : S.mood < 30 ? 0.85 : 1;

  c.idle = idle();

  c.foodMult = Math.max(0.2, 1 + (has('herding') ? 0.1 : 0) + (has('plough') ? 0.15 : 0) + (has('astronomy') ? 0.15 : 0) + (done('sickles') ? 0.15 : 0) + buff('food')) * d.food;
  const goodF = Math.min(j.farmers, sl.farm);
  c.farmFood = R((goodF * 3 + (j.farmers - goodF) * 0.5) * c.foodMult * low);
  c.wildFood = R(c.idle * 0.5 + sl.food);
  c.foodIn = c.farmFood + c.wildFood;
  c.foodOut = R(S.pop + j.warriors * 0.3);
  c.foodNet = c.foodIn - c.foodOut;
  c.foodCap = 150 + 250 * S.b.granary + 20 * landCount();
  // wood and stone
  const craft = 1 + 0.15 * S.b.workshop + (done('tools') ? 0.25 : 0);
  const goodW = Math.min(j.woodcutters, sl.wood), goodS = Math.min(j.masons, sl.stone);
  c.woodIn = R((goodW * 1.6 + (j.woodcutters - goodW) * 0.3) * craft * (has('copper') ? 1.1 : 1) * low);
  c.stoneIn = R((goodS * 1.2 + (j.masons - goodS) * 0.2) * craft * (has('masonry') ? 1.1 : 1) * low);
  c.storeCap = 100 + 200 * S.b.storehouse;
  // bronze: smiths need a forge, copper ore from hills or mountains, and tin from mountains or ships
  c.smithCap = S.b.forge * forgeSlots();
  c.workingSmiths = Math.min(j.smiths, c.smithCap);
  c.oreCap = has('bronze') && sl.tin ? sl.ore : 0;
  c.bronzeIn = Math.min(R(c.workingSmiths * 0.4 * 10) / 10, c.oreCap);
  c.bronzeWood = Math.ceil(c.bronzeIn * 2);
  // knowledge
  c.knowMult = 1 + 0.25 * S.b.tablets + (has('mathematics') ? 0.2 : 0) + (has('alphabet') ? 0.15 : 0);
  c.know = Math.round((j.scholars + S.pop / 25) * c.knowMult * low * 10) / 10;
  // defence
  c.weapon = 1 + (done('weapons') ? 0.6 : 0) + (done('chariots') ? 0.6 : 0) + (done('iron') ? 0.8 : 0);
  c.strength = R(j.warriors * c.weapon * (has('horses') ? 1.1 : 1) + buff('army'));

  c.crowd = S.pop > c.housing ? Math.ceil((S.pop - c.housing) * (has('medicine') ? 0.08 : 0.15)) : 0;
  c.starve = after < 0 ? Math.ceil(-after * 0.5) : 0;
  // mood
  const parts = [['Base', 50]];
  if (S.b.temple) parts.push(['Temples', 7 * S.b.temple]);
  if (has('rituals')) parts.push(['Rituals', 2]);
  if (has('weaving')) parts.push(['Fine cloth', 3]);
  if (has('writing')) parts.push(['Written records', 3]);
  if (has('law')) parts.push(['Law code', 8]);
  if (has('literature')) parts.push(['Epics and hymns', 4]);
  if (has('alphabet')) parts.push(['The alphabet', 3]);
  if (S.b.market) parts.push(['Market', 3]);
  if (S.b.tombs) parts.push(['Royal tombs', 8]);
  if (S.b.ziggurat) parts.push(['Ziggurat', 15]);
  if (S.b.palace) parts.push(['Palace', 5]);
  if (S.lore) parts.push([LORE.name, Math.min(10, S.lore)]);
  if (S.pop > c.housing) parts.push(['Overcrowding', -Math.min(20, R((S.pop - c.housing) / Math.max(1, c.housing) * 60))]);
  if (S.pop >= 300) parts.push(['Big-town quarrels', -Math.min(25, Math.floor((S.pop - 200) / 60))]);
  c.landLimit = 6 + (has('law') ? 4 : 0) + (S.b.palace ? 3 : 0);
  if (landCount() > c.landLimit) parts.push(['Too many lands to govern', -(landCount() - c.landLimit) * 3]);
  const wars = S.nbs.filter(a => a.alive && a.war).length;

}

function applyFx(fx) {
  for (const [k, v] of Object.entries(fx || {})) {
    if (!v) continue;
    if (k === 'pop') rescalePop(S.pop + v);
    else if (k === 'mood') S.mood = clamp(S.mood + v, 0, 100);
    else if (k === 'knowledge') S.progress += v;
    else if (k === 'land') addLand(v);

function checkResearch() {
  const learned = [];

    S.progress -= researchCost(S.research);
    if (S.research === 'lore') { S.lore++; learned.push(`${LORE.name}, song ${S.lore}`); continue; }
    const t = TECHS[S.research];
    S.techs.push(S.research);
    S.research = allKnown() ? 'lore' : null;
    learned.push(t.name);

  }

}

function changeJob(key, dir) {

function autoFarm() {

  if (!enough(tryF(pool))) { toast('Even with everyone farming, the food falls short.'); return; }
  let lo = 0, hi = pool;

function buildCost(id) {

// What the scouts find depends on the age and on boats

}
const festivalCost = () => ({ food: R(S.pop * 0.3 + 15) });

function gift(arg) {

// A raid on a neighbor: our warriors against theirs. Victory brings loot, and sometimes a land.
function raidCheck(a, c) {

function doRaid(a) {

function trade(arg) {

/* ---------- 5. End of turn ---------- */
function endTurn() {
  if (!S || S.over || modalOpen) return;
  const c = calc(), rep = [], before = { pop: S.pop, food: S.res.food };
  Sound.play('turn');
  let food = S.res.food + c.foodNet;
  if (food < 0) {
    const dead = Math.min(S.pop, Math.ceil(-food * 0.5));
    rescalePop(S.pop - dead);
    food = 0;
    S.mood -= 8;
    rep.push(['bad', `Famine: ${dead} people starved.`]);
  } else if (food > c.foodCap) {
    const lost = R(food - c.foodCap);
    food = c.foodCap;
    if (lost >= 10) rep.push(['', `${lost} grain spoiled. Granaries hold more.`]);
  }
  S.res.food = R(food);
  S.res.wood = Math.min(c.storeCap, S.res.wood + c.woodIn);
  S.res.stone = Math.min(c.storeCap, S.res.stone + c.stoneIn);
  // smiths burn charcoal: no wood, no bronze
  const cast = S.res.wood >= c.bronzeWood ? c.bronzeIn : 0;
  if (cast) { S.res.wood -= c.bronzeWood; S.res.bronze = R((S.res.bronze + cast) * 10) / 10; S.stats.bronzeCast += cast; }
  else if (c.bronzeIn) rep.push(['bad', 'The forges went cold: there was no wood for charcoal.']);
  if (S.vassal && S.turn < S.vassal.until) {
    const owe = S.vassal.food, paid = Math.min(owe, S.res.food);
    S.res.food -= paid;
    if (paid < owe) { S.mood = clamp(S.mood - 4, 0, 100); rep.push(['bad', `We could not pay ${S.vassal.to} its full tribute in grain.`]); }
  }
  S.progress += c.know;
  if (!S.research && allKnown()) S.research = 'lore';
  const learned = checkResearch();
  if (c.births > 0 && S.res.food > 0) rescalePop(S.pop + c.births);
  if (c.crowd > 0) { rescalePop(S.pop - c.crowd); rep.push(['bad', `Crowding and disease killed ${c.crowd}. Build houses or find more land.`]); }
  const diff = c.moodTarget - S.mood;
  if (diff) S.mood += Math.sign(diff) * Math.max(1, R(Math.abs(diff) * 0.3));
  S.mood = clamp(S.mood, 0, 100);
  if (S.mood < 15 && rnd() < 0.45) revolt(rep, c);
  S.buffs.forEach(b => { b.turns--; });
  S.buffs = S.buffs.filter(b => b.turns > 0);
  neighborsTurn(c, rep);
  S.turn++;
  S.raided = false;
  S.tradeUsed = 0;
  resolveThreats(rep);
  if (S.vassal && S.turn >= S.vassal.until) { rep.push(['good', `${S.vassal.to} has fallen; no one collects tribute from us any more.`]); S.vassal = null; }
  const age = ageOf(), title = titleOf();

  if (title !== S.title) {
    const up = TITLES.indexOf(title) > TITLES.indexOf(S.title);
    S.title = title;
    rep.push([up ? 'good' : 'bad', up ? `We have become ${article(title)} ${title.toLowerCase()}.` : `We have fallen back to ${article(title)} ${title.toLowerCase()}.`]);
  }
  recordHistory();
  scene.dirty = true;
  const dPop = S.pop - before.pop, dFood = S.res.food - before.food;
  log(`People ${signed(dPop)}, food ${signed(dFood)}.`);
  rep.forEach(([kind, text]) => log(text, kind));
  if (learned.length) Sound.play('chime');
  if (S.pop <= 5) return gameOver('Your people scatter', `Too few remain to keep the hearths burning, and the name of the ${S.name} is forgotten.`);
  if (S.mood <= 0) return gameOver('Civil war', `Rival elders raise their own followers. The ${S.name} tear themselves apart.`);
  if (S.turn >= LAST_TURN) { checkGoals(); save(); renderAll(); pushModal(collapseModal()); return; }
  const serious = rep.filter(([kind]) => kind === 'bad' || kind === 'big');
  if (serious.length) pushModal({ sign: 'land', title: `The years to ${fmtYear(S.turn)}`, html: `<ul>${rep.map(([kind, text]) => `<li class="${kind === 'bad' ? 'neg' : kind === 'good' ? 'pos' : ''}">${text}</li>`).join('')}</ul>`, choices: [{ label: 'Continue' }] });

function neighborsTurn(c, rep) {

function hashRand(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296; };
}
const hashStr = str => [...String(str)].reduce((h, ch) => Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0, 2166136261);
let grainTile = null;
function grain() {

  const g = c.getContext('2d'), img = g.createImageData(160, 160), r = hashRand(7);
  for (let k = 0; k < img.data.length; k += 4) {

function ridge(ctx, W, base, amp, r, color) {

function sceneFrame(now) {
  scene.raf = 0;
  const cv = $('#scene');
  if (!cv || !S) return;
  const box = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.round(box.width * dpr), H = Math.round(box.height * dpr);

  if (scene.dirty || key !== scene.key || !scene.cache) {

    return true;
  },
  tone(f, t, dur, { type = 'triangle', vol = 0.18, a = 0.005, f2 = 0, bus = null } = {}) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(bus || this.out);
    o.start(t);
    o.stop(t + dur + 0.05);
  },
  noise(t, dur, { vol = 0.15, freq = 1200, q = 0.8, f2 = 0 } = {}) {
    const ctx = this.ctx;
    if (!this.nbuf) {
      this.nbuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = this.nbuf.getChannelData(0);
      for (let k = 0; k < d.length; k++) d[k] = Math.random() * 2 - 1;
    }
    const src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = this.nbuf;
    fl.type = 'bandpass';
    fl.frequency.setValueAtTime(freq, t);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    fl.Q.value = q;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(fl);
    fl.connect(g);
    g.connect(this.out);
    src.start(t);
    src.stop(t + dur + 0.05);
  },
  pluck(f, t, vol = 0.16, bus = null) {
    this.tone(f, t, 1.2, { type: 'triangle', vol, a: 0.003, bus });
    this.tone(f * 2, t, 0.45, { type: 'sine', vol: vol * 0.35, a: 0.003, bus });
  },
  drum(t, vol = 0.5, f = 110) {
    this.tone(f, t, 0.35, { type: 'sine', vol, a: 0.002, f2: f * 0.45 });
    this.noise(t, 0.08, { vol: vol * 0.25, freq: 900 });
  },
  bell(f, t, vol = 0.12) {
    [1, 2.76, 5.4].forEach((m, k) => this.tone(f * m, t, 1.6 / (k + 1), { type: 'sine', vol: vol / (k + 1), a: 0.002 }));
  },
  play(name) {
    if (!this.set.sound || !this.init()) return;
    const t = this.ctx.currentTime + 0.02, N = SCALE;
    switch (name) {
      case 'tap': this.tone(660, t, 0.06, { type: 'sine', vol: 0.04 }); break;
      case 'build': this.drum(t, 0.25, 180); this.drum(t + 0.12, 0.2, 150); this.noise(t, 0.12, { vol: 0.08, freq: 500 }); break;
      case 'settle': [0, 2, 4].forEach((k, n) => this.pluck(N[k], t + n * 0.1)); break;
      case 'chime': this.bell(880, t); this.bell(1320, t + 0.15, 0.08); break;
      case 'coin': this.tone(2400, t, 0.12, { type: 'square', vol: 0.025 }); this.tone(3200, t + 0.06, 0.18, { type: 'square', vol: 0.02 }); break;
      case 'forge': [0, 0.18, 0.36].forEach(d => { this.tone(1800, t + d, 0.25, { type: 'square', vol: 0.025 }); this.noise(t + d, 0.06, { vol: 0.1, freq: 3000 }); }); break;
      case 'war': [0, 0.22, 0.44, 0.58].forEach((d, k) => this.drum(t + d, 0.45, k === 3 ? 70 : 90)); break;
      case 'victory': [0, 2, 4, 7].forEach((k, n) => this.pluck(N[k], t + n * 0.12, 0.18)); break;
      case 'defeat': [4, 3, 1, 0].forEach((k, n) => this.pluck(N[k] / 2, t + n * 0.18, 0.16)); break;
      case 'event': this.pluck(N[0], t, 0.12); this.pluck(N[4], t + 0.08, 0.1); break;
      case 'gong':
        this.tone(98, t, 3.5, { type: 'sine', vol: 0.25, a: 0.01 });
        this.tone(98 * 2.4, t, 2.2, { type: 'sine', vol: 0.08 });
        this.tone(98 * 3.9, t, 1.4, { type: 'sine', vol: 0.05 });
        this.noise(t, 0.4, { vol: 0.05, freq: 300 });
        break;
      case 'turn': this.noise(t, 0.5, { vol: 0.05, freq: 400, f2: 1600 }); this.drum(t + 0.05, 0.16, 120); break;
      case 'goal': [4, 7, 9].forEach((k, n) => this.bell(N[k], t + n * 0.09, 0.07)); break;
      case 'wonder':
        [0, 4, 7, 9, 11].forEach((k, n) => this.pluck(N[k], t + n * 0.1, 0.17));
        this.tone(N[0] / 2, t, 2.5, { type: 'sine', vol: 0.12, a: 0.05 });
        break;
      case 'festival':
        [0, 4, 2, 5, 4, 7].forEach((k, n) => this.pluck(N[k], t + n * 0.11, 0.14));
        this.drum(t, 0.25, 140);
        this.drum(t + 0.33, 0.25, 140);
        break;
      default: break;
    }
  },
  // Music: a low drone and lyre notes wandering a pentatonic scale
  music(on) {
    if (!on || !this.set.sound) {
      if (this.ctx) this.musicBus.gain.setTargetAtTime(0, this.ctx.currentTime, 0.4);
      clearInterval(this.timer);
      this.timer = 0;
      if (this.drone) {
        const t = this.ctx.currentTime;
        this.drone.forEach(o => o.stop(t + 1.5));
        this.drone = null;
      }
      return;
    }
    if (this.timer || !this.init()) return;
    const ctx = this.ctx, lp = ctx.createBiquadFilter(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
    lp.type = 'lowpass';
    lp.frequency.value = 420;
    g.gain.value = 0.035;
    lfo.frequency.value = 0.07;
    lg.gain.value = 160;
    lfo.connect(lg);
    lg.connect(lp.frequency);
    const oscs = [73.42, 110, 73.6].map(f => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(lp); return o; });
    lp.connect(g);
    g.connect(this.musicBus);
    this.drone = [...oscs, lfo];
    this.drone.forEach(o => o.start());
    this.musicBus.gain.setTargetAtTime(0.9, ctx.currentTime, 0.8);
    this.nextNote = ctx.currentTime + 0.6;
    this.timer = setInterval(() => this.schedule(), 200);
  },
  schedule() {
    if (!this.ctx || document.hidden) return;
    const now = this.ctx.currentTime;
    if (this.nextNote < now) this.nextNote = now + 0.1;
    while (this.nextNote < now + 0.6) {
      this.step = clamp(this.step + Math.floor(Math.random() * 5) - 2, 0, PENTA.length - 1);
      this.pluck(PENTA[this.step], this.nextNote, 0.07, this.musicBus);
      if (Math.random() < 0.25) this.pluck(PENTA[Math.max(0, this.step - 2)], this.nextNote + 0.02, 0.05, this.musicBus);
      this.nextNote += [0.45, 0.6, 0.9, 1.2, 1.8][Math.floor(Math.random() * 5)];
    }
  },
};
function toggleSound() {
  Sound.set.sound = !Sound.set.sound;
  saveSettings();
  Sound.music(Sound.set.music);
  Sound.play('tap');
  renderSoundBtn();
  if (modalOpen && currentModal.menu) drawModal(currentModal);
}
function toggleMusic() {
  Sound.set.music = !Sound.set.music;
  if (Sound.set.music && !Sound.set.sound) Sound.set.sound = true;
  saveSettings();
  Sound.music(Sound.set.music);
  renderSoundBtn();
  if (modalOpen && currentModal.menu) drawModal(currentModal);
}


/* ---------- 13. Boot ---------- */
const ACTIONS = {
  tab: id => {
    if (ui.tab === id && ui.drawer && !window.matchMedia('(max-width: 860px)').matches) ui.drawer = false;
    else { ui.tab = id; ui.drawer = true; }
    Sound.play('tap');
  },
  council: () => { ui.tab = 'council'; ui.drawer = true; },
  fold: () => { ui.drawer = false; },
  step: n => { ui.step = +n; },
  job: arg => { const [k, d] = arg.split(':'); changeJob(k, d); },
  autofarm: autoFarm,
  expedition, build, project, festival, gift, trade,
  research: setResearch,
  peace: askPeace,
  raid: raidNeighbor,
  end: endTurn,
  choose: k => choose(+k),
  help: showHelp,
  menu: () => pushModal(menuModal()),
  sound: toggleSound,
  music: toggleMusic,
  diff: id => { if (!DIFFS[id]) return; ui.diff = id; document.querySelectorAll('[data-act="diff"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.arg === id))); Sound.play('tap'); },
  copysave: copySave,
  loadsave: () => importSave(($('#loadCode') || {}).value || ''),
};
const SELF_RENDER = new Set(['end', 'choose', 'help', 'menu', 'sound', 'music', 'diff', 'copysave', 'loadsave']);
const MODAL_OK = new Set(['choose', 'sound', 'music', 'diff', 'copysave', 'loadsave']);
function nearestHist(svg, clientX) {
  const box = svg.getBoundingClientRect(), t = ((clientX - box.left) / box.width * CW - CL) / (CW - CL - CR) * LAST_TURN;
  let best = 0;
  S.hist.forEach((d, k) => { if (Math.abs(d.t - t) < Math.abs(S.hist[best].t - t)) best = k; });
  return best;
}
function bindEvents() {
  document.addEventListener('click', e => {
    const chipEl = e.target.closest('.chip');
    if (chipEl && !modalOpen) { toast(chipEl.title); return; }
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled || !S) return;
    const act = el.dataset.act;
    if (modalOpen && !MODAL_OK.has(act)) return;
    if (!ACTIONS[act]) return;
    ACTIONS[act](el.dataset.arg);
    if (!SELF_RENDER.has(act)) { if (!S.over) checkGoals(); save(); renderAll(); }
  });
  document.addEventListener('keydown', e => {
    if (!S) return;
    if (e.target.id === 'peopleName' && e.key === 'Enter') { e.preventDefault(); choose(0); return; }
    if (e.key === 'Escape' && modalOpen) { const k = currentModal.choices.findIndex(ch => ch.cancel); if (k >= 0) { e.preventDefault(); choose(k); } return; }
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
    const chipEl = e.target.closest && e.target.closest('.chip');
    if (chipEl && !modalOpen && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toast(chipEl.title); return; }
    const chart = e.target.closest && e.target.closest('svg[data-chart]');
    if (chart && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); chartPoint(chart, (chart.dataset.idx == null ? S.hist.length - 1 : +chart.dataset.idx) + (e.key === 'ArrowLeft' ? -1 : 1)); return; }
    if (modalOpen) return;
    if (e.key === 'e' || e.key === 'E') endTurn();
    else if (/^[1-7]$/.test(e.key)) { ui.tab = TABS[+e.key - 1][0]; ui.drawer = true; renderAll(); }
    else if (e.key === '?') showHelp();
    else if (e.key === 'm' || e.key === 'M') toggleSound();
  });
  document.addEventListener('pointermove', e => { const svg = e.target.closest && e.target.closest('svg[data-chart]'); if (svg && S.hist.length) chartPoint(svg, nearestHist(svg, e.clientX)); });
  document.addEventListener('pointerout', e => { const svg = e.target.closest && e.target.closest('svg[data-chart]'); if (svg && !svg.contains(e.relatedTarget)) chartHide(svg); });
  document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('svg[data-chart]') && S.hist.length) chartPoint(e.target, S.hist.length - 1); });
  document.addEventListener('focusout', e => { if (e.target.matches && e.target.matches('svg[data-chart]')) chartHide(e.target); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) kickScene(); });
}
function start(data) {
  Sound.set = loadSettings();
  document.documentElement.style.setProperty('--grain', `url(${grain().toDataURL()})`);
  bindEvents();
  if (window.ResizeObserver) new ResizeObserver(() => kickScene()).observe($('#board'));
  else window.addEventListener('resize', kickScene);
  const saved = (data && data.save && sanitize(data.save)) || loadSave();
  if (saved && !saved.over) {
    S = saved;
    if (!S.hist.length) recordHistory();
    renderAll();
    restorePending();
  } else {
    newGame('Uruma');
    renderAll();
    showIntro();
  }
  if (Sound.set.music) document.addEventListener('pointerdown', () => Sound.music(true), { once: true });
}
window.claude?.hot?.snapshot?.(() => ({ save: S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
