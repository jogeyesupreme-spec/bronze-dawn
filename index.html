<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Bronze Dawn: lead a river tribe from 3000 BC to the Bronze Age Collapse of 1200 BC.">
<title>Bronze Dawn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Eczar:wght@500;600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Noto+Sans+Cuneiform&display=swap">
<style>
:root {
  /* Layout: a lapis-and-shell plaque after the Standard of Ur. Inlay frieze on top,
     map tablet on the left, ledger of tabs on the right, timeline bar fixed below. */
  color-scheme: dark;
  --lapis: #16224f;
  --lapis-deep: #0c1535;
  --panel: #111a41;
  --panel-2: #1a2759;
  --line: #2d3d7c;
  --shell: #f2e9d6;
  --muted: #a9b0d2;
  --gold: #ecbf5a;
  --bronze: #c48a43;
  --carnelian: #e2694b;
  --verdigris: #6cc4a6;
  --bitumen: #070b1f;
  --water: #8fc9d8;
  --river: #4f9fbf;
  --tin: #b9c3d6;
  --t-R: #3b6a59; --t-P: #75703f; --t-F: #2c5236; --t-H: #6d5236;
  --t-M: #5b5770; --t-D: #978257; --t-S: #13245a;
  --o-player: #ecbf5a; --o-kesh: #f2e9d6; --o-hattu: #e2694b;
  --o-amurru: #b693e8; --o-dilmun: #56d4c9;
  --font-display: "Eczar", Georgia, "Times New Roman", serif;
  --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --font-cu: "Noto Sans Cuneiform", "Segoe UI Historic", sans-serif;
  --radius: 8px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  color: var(--shell);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  background-color: var(--lapis);
  /* pyrite flecks in lapis lazuli */
  background-image:
    radial-gradient(rgba(236, 191, 90, .32) .7px, transparent 1.3px),
    radial-gradient(rgba(236, 191, 90, .16) .6px, transparent 1.1px),
    radial-gradient(120% 80% at 50% 0%, rgba(255, 255, 255, .05), transparent 60%);
  background-size: 41px 37px, 23px 29px, 100% 100%;
  background-position: 0 0, 13px 19px, 0 0;
}
button { font: inherit; }
:focus-visible { outline: 2px solid var(--shell); outline-offset: 2px; }
.cu { font-family: var(--font-cu); line-height: 1; font-weight: 400; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.pos { color: var(--verdigris); }
.neg { color: var(--carnelian); }
.h {
  margin: 0;
  font: 700 .74rem/1.2 var(--font-body);
  text-transform: uppercase;
  letter-spacing: .16em;
  color: var(--muted);
}
kbd {
  font: 700 .78rem/1 var(--font-body);
  padding: 2px 6px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  background: var(--lapis-deep);
  color: var(--shell);
}

/* ---------- frieze and header ---------- */
.frieze {
  height: 12px;
  background-color: var(--shell);
  background-image:
    linear-gradient(to bottom right, transparent 50%, var(--carnelian) 50%),
    linear-gradient(to bottom left, transparent 50%, var(--carnelian) 50%);
  background-size: 14px 12px;
  border-bottom: 3px solid var(--bitumen);
}
.app {
  max-width: 1320px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 0 130px;
  display: grid;
  gap: 14px;
}
.top {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px 28px;
  padding-block: 16px 2px;
}
.brand { display: grid; gap: 4px; min-width: 0; }
.brand h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.8rem, 4vw, 2.5rem);
  line-height: 1;
  color: var(--gold);
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.realm { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: flex-end; }
.stat { display: grid; gap: 2px; }
.stat .v { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; line-height: 1.1; }
.hdr-btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- resources ---------- */
.res { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.chip {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  column-gap: 9px;
  align-items: center;
  padding: 8px 10px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: help;
}
.chip .cu { grid-row: span 2; font-size: 1.15rem; letter-spacing: -.12em; color: var(--gold); min-width: 1.4rem; text-align: center; }
.chip .lab { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.chip .val { font-size: 1.12rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .d { font-size: .8rem; font-weight: 500; }
.chip.warn { border-color: var(--carnelian); }
@media (max-width: 560px) {
  .res { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .chip { padding: 6px 8px; column-gap: 5px; }
  .chip .cu { grid-row: auto; font-size: .85rem; min-width: 0; }
  .chip .lab { font-size: .62rem; letter-spacing: .06em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .val { grid-column: 1 / -1; font-size: 1rem; }
  .chip .val .muted { display: none; }
}

/* ---------- main layout ---------- */
.main { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 960px) {
  .main { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; }
  .board { position: sticky; top: 10px; }
}

/* ---------- map ---------- */
.board {
  background: var(--lapis-deep);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  box-shadow: inset 0 0 0 4px var(--panel), 0 10px 30px rgba(0, 0, 0, .35);
  display: grid;
  gap: 8px;
  min-width: 0;
}
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 4px 6px 0; font-size: .85rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; background: var(--oc); display: inline-block; }
#map { display: block; width: 100%; height: auto; touch-action: manipulation; }
.hex { stroke: var(--bitumen); stroke-width: 1.5; }
.t-R { fill: var(--t-R); } .t-P { fill: var(--t-P); } .t-F { fill: var(--t-F); } .t-H { fill: var(--t-H); }
.t-M { fill: var(--t-M); } .t-D { fill: var(--t-D); } .t-S { fill: var(--t-S); }
.deco { fill: none; stroke: rgba(242, 233, 214, .35); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.deco-R { stroke: rgba(170, 220, 160, .5); }
.deco-F { fill: rgba(8, 26, 14, .55); stroke: none; }
.deco-M { fill: rgba(220, 215, 240, .16); stroke: rgba(242, 233, 214, .4); }
.deco-S { stroke: rgba(143, 201, 216, .35); }
.deco-D { stroke: rgba(60, 40, 20, .55); stroke-width: 2.6; }
.river-bank { fill: none; stroke: rgba(7, 11, 31, .55); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.river { fill: none; stroke: var(--river); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.river-glint { fill: none; stroke: rgba(200, 235, 245, .45); stroke-width: 1.2; stroke-dasharray: 2 9; stroke-linecap: round; pointer-events: none; }
.ownfill { fill: var(--oc); fill-opacity: .13; pointer-events: none; }
.ownfill.fresh { animation: claim 1.4s ease-out 1; }
@keyframes claim { 0% { fill-opacity: .6; } 100% { fill-opacity: .13; } }
.border { fill: none; stroke: var(--oc); stroke-width: 3.2; stroke-linecap: round; pointer-events: none; }
.border.war { stroke-dasharray: 5 4; }
.claim { fill: none; stroke: var(--gold); stroke-width: 1.5; stroke-dasharray: 3 4; opacity: .75; pointer-events: none; }
.sel { fill: none; stroke: var(--shell); stroke-width: 3; pointer-events: none; }
.cap { fill: var(--oc); stroke: var(--bitumen); stroke-width: 1.2; pointer-events: none; }
.impi { stroke: var(--bitumen); stroke-width: 1; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
.impi-bg { fill: rgba(7, 11, 31, .72); stroke: var(--bronze); stroke-width: 1; pointer-events: none; }
.swords { fill: none; stroke: var(--carnelian); stroke-width: 2.2; stroke-linecap: round; pointer-events: none; }
.tile { cursor: pointer; outline: none; }
.tile:hover .hex { filter: brightness(1.2); }
.tile:focus-visible .hex { stroke: var(--shell); stroke-width: 3; }

.tileinfo { display: grid; gap: 8px; padding: 6px 6px 4px; }
.ti-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; }
.ti-head h3 { margin: 0; font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; }
.ti-stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .9rem; color: var(--muted); }
.ti-stats b { color: var(--shell); font-variant-numeric: tabular-nums; }
.tileinfo p { margin: 0; }

/* ---------- side panel ---------- */
.side {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  min-width: 0;
}
.advice { display: grid; gap: 6px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.tip { margin: 0; display: grid; grid-template-columns: 1.3rem minmax(0, 1fr); gap: 6px; font-size: .95rem; }
.tip .cu { color: var(--bronze); font-size: 1rem; padding-top: .2em; }
.tip.bad .cu, .tip.bad { color: var(--carnelian); }
.tip.good .cu { color: var(--verdigris); }
.buffs { display: flex; flex-wrap: wrap; gap: 6px; }
.goals { display: grid; gap: 4px; margin: 4px 0 0; padding: 8px 10px; list-style: none; background: var(--lapis-deep); border-radius: 6px; }
.goals li { display: grid; grid-template-columns: 1.1rem minmax(0, 1fr) auto; gap: 6px; font-size: .9rem; align-items: baseline; }
.goals li::before { content: ''; width: 9px; height: 9px; border: 1.5px solid var(--gold); transform: rotate(45deg); align-self: center; justify-self: center; }
.goals li.done::before { background: var(--gold); }
.goals li.done { color: var(--muted); }
.goals .rw { color: var(--muted); font-size: .8rem; white-space: nowrap; }
.tabs { display: flex; flex-wrap: wrap; gap: 0 2px; background: var(--lapis-deep); border-bottom: 1px solid var(--line); }
.tab {
  flex: 0 0 auto;
  position: relative;
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  font-weight: 700;
  font-size: .95rem;
  padding: 10px 14px;
  cursor: pointer;
}
.tab[aria-selected="true"] { color: var(--gold); border-bottom-color: var(--gold); }
.tab .dot { position: absolute; top: 8px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--carnelian); }
.pane { display: grid; gap: 12px; padding: 14px; }
.pane p { margin: 0; }

/* ---------- controls ---------- */
.btn {
  font-weight: 700;
  font-size: .92rem;
  color: var(--bitumen);
  background: linear-gradient(var(--gold), var(--bronze));
  border: 1px solid var(--bitumen);
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { background: var(--panel-2); color: var(--muted); border-color: var(--line); cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--shell); border-color: var(--line); }
.btn.ghost:hover:not(:disabled) { border-color: var(--gold); }
.btn.danger { background: linear-gradient(#ef8a6d, var(--carnelian)); }
.btn.sq { width: 34px; height: 34px; padding: 0; font-size: 1.2rem; line-height: 1; }
.chipbtn {
  font-weight: 700;
  font-size: .85rem;
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 11px;
  cursor: pointer;
}
.chipbtn[aria-pressed="true"] { background: var(--gold); color: var(--bitumen); border-color: var(--gold); }
.steps { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pill {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .04em;
  border: 1px solid var(--line);
  color: var(--muted);
}
.pill.war { background: var(--carnelian); border-color: var(--carnelian); color: var(--bitumen); }
.pill.peace { border-color: var(--verdigris); color: var(--verdigris); }
.pill.own { border-color: var(--oc); color: var(--oc); }
.pill.gold { border-color: var(--gold); color: var(--gold); }
.pill.bad { border-color: var(--carnelian); color: var(--carnelian); }

/* ---------- people ---------- */
.jobs { display: grid; }
.job {
  display: grid;
  grid-template-columns: 3.2rem minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}
.job > .cu { font-size: 1.15rem; letter-spacing: -.12em; color: var(--gold); text-align: center; overflow: hidden; white-space: nowrap; }
.job-txt { display: grid; gap: 1px; min-width: 0; }
.job-txt b { font-size: 1.02rem; }
.out { font-size: .9rem; font-variant-numeric: tabular-nums; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper .n { min-width: 3.2ch; text-align: center; font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.ledger { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 14px; font-size: .95rem; font-variant-numeric: tabular-nums; }
.ledger span:nth-child(even) { text-align: right; }
.ledger .tot { border-top: 1px solid var(--line); padding-top: 4px; font-weight: 700; }

/* ---------- lists ---------- */
.item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 4px 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.item h4 { margin: 0; font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; }
.item .meta { color: var(--muted); font-size: .9rem; }
.item .note { color: var(--muted); font-size: .85rem; font-style: italic; }
.item .why { color: var(--carnelian); font-size: .84rem; }
.item.locked h4 { color: var(--muted); }
.item.wonder h4 { color: var(--gold); }
.item.built h4::after { content: ' ✓'; color: var(--verdigris); }
.count { font-family: var(--font-body); font-size: .85rem; color: var(--muted); font-weight: 500; }
.bar { height: 8px; background: var(--lapis-deep); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--bronze), var(--gold)); }
.current { display: grid; gap: 6px; padding: 12px; background: var(--panel-2); border-radius: var(--radius); }
.current h4 { margin: 0; font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; }
.godbox { display: grid; gap: 6px; padding: 12px; background: var(--panel-2); border: 1px solid var(--bronze); border-radius: var(--radius); }
.godbox h4 { margin: 0; font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; color: var(--gold); }

/* ---------- neighbors ---------- */
.nb { display: grid; gap: 8px; padding: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); }
.nb.gone { opacity: .6; }
.nb.threat { border-color: var(--carnelian); }
.nb-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.nb-head h4 { margin: 0; font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }
.sw { width: 12px; height: 12px; border-radius: 3px; background: var(--oc); }
.nb-stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .9rem; color: var(--muted); }
.nb-stats b { color: var(--shell); }
.meter { position: relative; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--carnelian), var(--lapis-deep) 50%, var(--verdigris)); }
.meter i { position: absolute; top: -4px; width: 4px; height: 14px; margin-left: -2px; background: var(--shell); border-radius: 2px; }
.nb-acts { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- trade ---------- */
.scroll { overflow-x: auto; }
.trade { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.trade th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding: 6px; }
.trade td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
.trade td .cu { color: var(--gold); margin-right: 4px; }
.trade .acts { display: flex; justify-content: flex-end; gap: 6px; }

/* ---------- chronicle ---------- */
.chron { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.chron li { display: grid; grid-template-columns: 5.4rem minmax(0, 1fr); gap: 8px; font-size: .95rem; }
.chron .yr { color: var(--muted); font-variant-numeric: tabular-nums; }
.chron li.bad { color: var(--carnelian); }
.chron li.good { color: var(--verdigris); }
.chron li.big { color: var(--gold); }
.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 14px; }
.gloss div { display: flex; align-items: center; gap: 10px; font-size: .9rem; }
.gloss .cu { font-size: 1.35rem; color: var(--gold); min-width: 2.6rem; }
.chart { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font: 500 11px var(--font-body); }
.chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .end { font: 700 11px var(--font-body); }
.chart .collapse { stroke: var(--carnelian); stroke-dasharray: 3 3; }
.minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 16px; }
.mini { position: relative; margin: 0; max-width: 360px; }
.mini figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ctip { position: absolute; top: 22px; padding: 4px 8px; border-radius: 6px; background: var(--bitumen); border: 1px solid var(--line); font-size: .8rem; pointer-events: none; white-space: nowrap; }
details summary { cursor: pointer; }
.ach { display: grid; gap: 6px; }
.ach div { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr); gap: 8px; font-size: .92rem; }
.ach div.locked { color: var(--muted); }
.ach .cu { color: var(--gold); font-size: 1.1rem; }
.ach div.locked .cu { color: var(--line); }
.best { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
.best td, .best th { text-align: left; padding: 5px 6px; border-top: 1px solid var(--line); }
.best th { font-size: .7rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); border-top: 0; }
.best td:last-child, .best th:last-child { text-align: right; }

/* ---------- turn bar ---------- */
.turnbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  background: var(--bitumen);
  border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.turnbar .inner { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
.timeline { flex: 1; min-width: 0; display: grid; gap: 6px; }
.tl-labels { display: flex; justify-content: space-between; gap: 10px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-labels b { color: var(--shell); }
.tl-labels .col { color: var(--carnelian); }
.tl-track { position: relative; height: 6px; background: var(--panel-2); border-radius: 3px; }
.tl-track > i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--bronze), var(--gold)); transition: width .6s ease; }
.tl-track b { position: absolute; top: -3px; width: 2px; height: 12px; margin-left: -1px; background: var(--muted); border-radius: 1px; }
.tl-track b.next { background: var(--carnelian); }
.endturn { font-family: var(--font-display); font-size: 1.1rem; padding: 9px 20px; display: grid; line-height: 1.1; text-align: center; }
.endturn small { font-family: var(--font-body); font-size: .75rem; font-weight: 500; }
@media (max-width: 560px) {
  .tl-labels .edge { display: none; }
  .tl-labels { justify-content: flex-start; }
  .endturn { padding: 8px 14px; }
}

/* ---------- modal and toast ---------- */
.modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(7, 11, 31, .8);
}
.card {
  width: min(560px, 100%);
  max-height: calc(100% - 16px);
  overflow: auto;
  display: grid;
  gap: 14px;
  padding: 22px;
  background: var(--panel-2);
  border: 1px solid var(--bronze);
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
  animation: rise .2s ease-out;
}
.card p { margin: 0; }
.card .bigcu { font-size: 2.6rem; color: var(--gold); }
.card .date { margin: -8px 0 0; font: 700 .74rem/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .16em; color: var(--bronze); }
.card h2 { margin: 0; font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; line-height: 1.1; text-wrap: balance; }
.card h3 { margin: 0; font: 700 .74rem/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .16em; color: var(--muted); }
.card ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 5px; }
.card label { font-weight: 700; }
.card input, .card textarea {
  width: 100%;
  font: inherit;
  color: var(--shell);
  background: var(--lapis-deep);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
}
.card textarea { font: 500 .78rem/1.35 ui-monospace, Menlo, Consolas, monospace; min-height: 90px; resize: vertical; word-break: break-all; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px; }
.seg .btn { display: grid; gap: 1px; text-align: left; white-space: normal; padding: 8px 12px; }
.seg .btn[aria-pressed="true"] { outline: 2px solid var(--shell); outline-offset: 1px; }
.seg .btn small { font-weight: 500; font-size: .8rem; opacity: .85; }
.choices { display: grid; gap: 8px; }
.choice { display: grid; gap: 2px; text-align: left; padding: 10px 14px; white-space: normal; }
.choice .hint { font-weight: 500; font-size: .85rem; opacity: .85; }
.tests { display: grid; gap: 6px; }
.tests div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 8px 10px; background: var(--lapis-deep); border-radius: 6px; }
.rank { font-family: var(--font-display); font-size: 1.3rem; color: var(--gold); }
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 60;
  max-width: calc(100% - 32px);
  padding: 8px 16px;
  background: var(--shell);
  color: var(--bitumen);
  border-radius: 6px;
  font-weight: 700;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .4);
  animation: rise .2s ease-out;
}

@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
.toast { animation-name: toastIn; }
@keyframes toastIn { from { transform: translate(-50%, 8px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .card, .toast { animation: none; }

// Seeded random numbers (mulberry32). The state lives in the save, so reloading cannot reroll a battle or an omen.
function rnd() {
  let t = (S.rng = (S.rng + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);

}

// Everything a game needs apart from the map and the neighbors. Old saves are filled in from here.
function defaults() {
  return {

    jobs: { farmers: 30, workers: 10, soldiers: 5, scholars: 3 },
    res: { food: 100, materials: 30, copper: 0, tin: 0, bronze: 0, silver: 15 },
    stability: 60, techs: ['agriculture'], research: null, progress: 0, lore: 0,
    b: Object.fromEntries(Object.keys(BUILDINGS).map(k => [k, 0])), proj: [], deity: null,
    buffs: [], log: [], cool: {}, attacked: false, tradeUsed: 0, conquered: 0, over: false, era: '', title: '',
    hist: [], goals: [], pending: [], vassal: null, threats: [], flags: {}, fame: [],
    stats: { bronzeCast: 0, silverEarned: 0, wars: 0, battlesWon: 0, maxTitle: 0 },
  };
}

function newGame(name, diff = 'normal') {
  S = { ...defaults(), name, diff };
  const starts = [PLAYER_START, ...AI_DEFS.map(d => d.start)].map(([c, r]) => tileIdx(c, r));
  const tiles = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) tiles.push({ t: MAP_TEMPLATE[r][c], owner: null, imp: null, capital: false });
  }
  // a little variety each game: some plains turn to forest or hills
  tiles.forEach((tile, i) => {
    if (tile.t !== 'P' || starts.includes(i)) return;
    const x = rnd();
    if (x < 0.1) tile.t = 'F';
    else if (x < 0.18) tile.t = 'H';
  });
  S.tiles = tiles;
  S.ais = AI_DEFS.map(d => ({ id: d.id, name: d.name, att: d.base, army: 10 * d.mil, war: false, warTurns: 0, alive: true, cool: 0, pact: false, ally: false }));
  const p = tileIdx(...PLAYER_START);
  tiles[p].owner = 'player';
  tiles[p].capital = true;
  AI_DEFS.forEach(d => {
    const i = tileIdx(...d.start);
    tiles[i].owner = d.id;
    tiles[i].capital = true;
    const opts = neighbors(i).filter(j => !tiles[j].owner && tiles[j].t !== 'S' && !starts.includes(j) && !neighbors(j).includes(p));
    if (opts.length) tiles[pick(opts)].owner = d.id;
  });
  S.era = eraOf();
  S.title = titleOf();
  log(`The ${name} settle beside the river.`, 'big');
  ui.sel = p;
  ui.tab = 'people';
  ui.fresh = new Set();
  recordHistory();
}

function log(text, kind = '') {
  S.log.unshift({ y: S.turn, text, kind });
  if (S.log.length > 150) S.log.length = 150;
}

// Bring an old or imported save up to date. Returns null if it is not a Bronze Dawn game.
function migrate(s) {
  if (!s || typeof s !== 'object' || !Array.isArray(s.tiles) || s.tiles.length !== COLS * ROWS || !Array.isArray(s.ais) || !s.jobs || !s.res) return null;
  if (s.v !== 1 && s.v !== SAVE_VERSION) return null;
  const base = defaults();
  for (const k of Object.keys(base)) if (s[k] === undefined || s[k] === null && base[k] !== null) s[k] = base[k];
  for (const k of ['res', 'stats', 'b', 'jobs']) s[k] = { ...base[k], ...(typeof s[k] === 'object' ? s[k] : {}) };

}
// A save may come from anywhere (a pasted code, an old version), so every field is checked before the game trusts it
function sanitize(s) {

  });

  for (const t of s.tiles) {

    if (t.owner != null && !owners.has(t.owner)) t.owner = null;
    if (t.imp != null && !IMPROVEMENTS[t.imp]) t.imp = null;
    t.capital = !!t.capital;
  }
  if (!s.tiles.some(t => t.owner === 'player')) return null;
  s.name = String(s.name || '').replace(/[<>&"'`]/g, '').trim().slice(0, 24) || 'Uruma';
  if (!DIFFS[s.diff]) s.diff = 'normal';
  s.turn = clamp(Math.floor(num(s.turn)), 0, LAST_TURN);
  s.pop = Math.max(0, Math.floor(num(s.pop)));
  for (const k of Object.keys(s.jobs)) if (!(k in defaults().jobs)) delete s.jobs[k];
  for (const k of Object.keys(s.jobs)) s.jobs[k] = Math.max(0, Math.floor(num(s.jobs[k])));
  for (const k of ['workers', 'farmers', 'scholars', 'soldiers']) {
    const over = Object.values(s.jobs).reduce((a, b) => a + b, 0) - s.pop;
    if (over > 0) s.jobs[k] = Math.max(0, s.jobs[k] - over);
  }
  s.res = Object.fromEntries(Object.keys(defaults().res).map(k => [k, Math.max(0, R(num(s.res[k])))]));
  s.stability = clamp(R(num(s.stability, 50)), 0, 100);
  s.techs = [...new Set(['agriculture', ...arr(s.techs).filter(id => TECHS[id])])];
  if (s.research !== 'lore' && !(TECHS[s.research] && !s.techs.includes(s.research))) s.research = null;
  s.progress = Math.max(0, num(s.progress));
  s.lore = Math.max(0, Math.floor(num(s.lore)));
  s.b = Object.fromEntries(Object.keys(BUILDINGS).map(k => [k, clamp(Math.floor(num(s.b[k])), 0, BUILDINGS[k].max)]));
  s.proj = [...new Set(arr(s.proj).filter(id => PROJECTS[id]))];
  if (!GODS[s.deity]) s.deity = null;
  s.buffs = arr(s.buffs).filter(b => b && typeof b === 'object').map(b => ({ name: String(b.name || 'Omen').slice(0, 60), turns: Math.max(1, Math.floor(num(b.turns, 1))), food: num(b.food), stab: num(b.stab), army: num(b.army), caravan: num(b.caravan) }));
  s.log = arr(s.log).filter(e => e && typeof e.text === 'string').slice(0, 150).map(e => ({ y: num(e.y), text: e.text.slice(0, 400), kind: ['good', 'bad', 'big'].includes(e.kind) ? e.kind : '' }));
  s.hist = arr(s.hist).filter(d => d && typeof d === 'object').slice(-(LAST_TURN + 5)).map(d => ({ t: num(d.t), pop: num(d.pop), army: num(d.army), know: num(d.know), food: num(d.food), lands: num(d.lands), stab: num(d.stab) }));
  s.goals = arr(s.goals).filter(id => GOALS.some(g => g.id === id));
  s.pending = arr(s.pending).filter(p => p && ['event', 'hist', 'peace', 'collapse'].includes(p.type)).map(p => ({ type: p.type, arg: p.arg == null ? undefined : String(p.arg) }));

  s.threats = arr(s.threats).filter(t => t && typeof t === 'object').map(t => ({ name: 'Akkad', turn: num(t.turn), power: Math.max(0, num(t.power)), id: 'akkad' }));
  s.flags = Object.fromEntries(Object.entries(s.flags && typeof s.flags === 'object' ? s.flags : {}).map(([k, v]) => [k, !!v]));
  s.cool = Object.fromEntries(Object.entries(s.cool && typeof s.cool === 'object' ? s.cool : {}).map(([k, v]) => [k, num(v)]));
  s.fame = arr(s.fame).filter(Array.isArray).map(f => [String(f[0]).slice(0, 80), num(f[1])]);
  s.stats = Object.fromEntries(Object.keys(defaults().stats).map(k => [k, num(s.stats[k])]));
  s.rng = num(s.rng, freshSeed()) >>> 0;
  s.over = !!s.over;
  s.attacked = !!s.attacked;
  s.tradeUsed = Math.max(0, num(s.tradeUsed));
  s.conquered = Math.max(0, num(s.conquered));
  s.era = String(s.era || '');
  s.title = TITLES.includes(s.title) ? s.title : 'Tribe';
  return s;
}

// Population changes keep the current split between jobs
function groups() {
  const j = S.jobs;
  return { farmers: j.farmers, workers: j.workers, soldiers: j.soldiers, scholars: j.scholars, foragers: S.pop - j.farmers - j.workers - j.soldiers - j.scholars };
}
function rescalePop(target) {
  target = Math.max(0, R(target));
  const g = groups(), keys = Object.keys(g), old = S.pop;
  if (old <= 0) { S.pop = target; return; }
  const exact = keys.map(k => g[k] * target / old);
  const base = exact.map(Math.floor);
  let rem = target - base.reduce((a, b) => a + b, 0);
  const order = exact.map((v, i) => [v - base[i], i]).sort((a, b) => b[0] - a[0]);
  for (let k = 0; rem > 0; k = (k + 1) % order.length, rem--) base[order[k][1]]++;
  keys.forEach((k, i) => { if (k !== 'foragers') S.jobs[k] = base[i]; });
  S.pop = target;
}
function killSoldiers(n) {
  n = Math.min(Math.max(0, R(n)), S.jobs.soldiers);
  S.jobs.soldiers -= n;
  S.pop -= n;
  return n;
}

/* ---------- 3. Map geometry (pointy-top hexes, odd rows shifted right) ---------- */
function hexCenter(c, r) {
  return [PAD + HEX * SQ3 / 2 + c * HEX * SQ3 + (r & 1) * HEX * SQ3 / 2, PAD + HEX + r * HEX * 1.5];
}
// Corner k sits at 60k − 30 degrees, so edge k (corner k to k+1) faces the neighbor in direction k of nbDir
function hexCorner(x, y, size, k) {
  const a = Math.PI / 180 * (60 * k - 30);
  return [x + size * Math.cos(a), y + size * Math.sin(a)];
}
function hexPoints(x, y, size) {
  return [0, 1, 2, 3, 4, 5].map(k => hexCorner(x, y, size, k).map(v => v.toFixed(1)).join(',')).join(' ');
}
// Neighbor of tile i in direction k: 0 east, 1 south-east, 2 south-west, 3 west, 4 north-west, 5 north-east. −1 off the map.
function nbDir(i, k) {
  const c = i % COLS, r = Math.floor(i / COLS), odd = r & 1;
  const [dc, dr] = [[1, 0], [odd, 1], [odd - 1, 1], [-1, 0], [odd - 1, -1], [odd, -1]][k];
  const cc = c + dc, rr = r + dr;
  return cc >= 0 && cc < COLS && rr >= 0 && rr < ROWS ? tileIdx(cc, rr) : -1;
}
function hexDist(a, b) {
  const cube = i => { const c = i % COLS, r = Math.floor(i / COLS), x = c - (r - (r & 1)) / 2; return [x, r, -x - r]; };
  const p = cube(a), q = cube(b);
  return Math.max(...p.map((v, k) => Math.abs(v - q[k])));
}
function neighbors(i) {
  return [0, 1, 2, 3, 4, 5].map(k => nbDir(i, k)).filter(j => j >= 0);
}
const isCoast = i => S.tiles[i].t !== 'S' && neighbors(i).some(j => S.tiles[j].t === 'S');
const isFrontier = i => neighbors(i).some(j => S.tiles[j].owner === 'player');
function frontier(owner) {
  const out = new Set();
  S.tiles.forEach((t, i) => {
    if (t.owner === owner) neighbors(i).forEach(j => { if (S.tiles[j].owner !== owner) out.add(j); });
  });
  return [...out];
}
const borders = (a, b) => S.tiles.some((t, i) => t.owner === a && neighbors(i).some(j => S.tiles[j].owner === b));
const bordersPlayer = id => borders(id, 'player');
const ownsTerrain = t => S.tiles.some(x => x.owner === 'player' && x.t === t);
const ownsImp = k => S.tiles.some(x => x.owner === 'player' && x.imp === k);
const ownerName = o => (o === 'player' ? `The ${S.name}` : o ? AI_DEF[o].name : 'Unclaimed');

/* ---------- 4. Economy: everything the next turn will produce ---------- */
function calc() {
  const c = {}, j = S.jobs, god = S.deity;
  let farmSlots = 0, housing = 0, tileMat = 0, extraFood = 0, copperIn = 0, tinIn = 0, harbors = 0, tiles = 0, pastures = 0, coastal = 0;
  S.tiles.forEach((t, i) => {
    if (t.owner !== 'player') return;
    const T = TERRAIN[t.t];
    tiles++;
    farmSlots += T.farm + (has('plough') && (t.t === 'R' || t.t === 'P') ? 10 : 0);
    housing += T.house + (t.capital ? 40 : 0);
    tileMat += T.mat;
    if (isCoast(i)) coastal++;
    if (!t.imp) return;
    const fx = IMPROVEMENTS[t.imp].fx;
    farmSlots += (fx.farm || 0) + (t.imp === 'canal' && has('engineering') ? 10 : 0);
    extraFood += fx.food || 0;
    tileMat += fx.mat || 0;
    copperIn += fx.copper || 0;
    tinIn += fx.tin || 0;
    harbors += fx.caravan || 0;
    if (t.imp === 'pasture') { pastures++; if (god === 'nanna') extraFood += 6; }
    if (t.imp === 'harbor' && has('seafaring')) { extraFood += 10; harbors++; }
  });
  if (S.b.greatCanal) farmSlots += 60;
  housing += S.b.house * houseSize() + (S.b.palace ? 150 : 0);
  const buff = k => S.buffs.reduce((a, b) => a + (b[k] || 0), 0);
  const low = S.stability < 15 ? 0.7 : S.stability < 30 ? 0.85 : 1;
  const foragers = S.pop - j.farmers - j.workers - j.soldiers - j.scholars;

  // food
  const foodMult = Math.max(0.2, 1 + (has('husbandry') ? 0.1 : 0) + (has('astronomy') ? 0.15 : 0) + (done('sickles') ? 0.2 : 0) + (god === 'nanna' ? 0.1 : 0) + buff('food')) * D().food;
  const good = Math.min(j.farmers, farmSlots);
  c.farmSlots = farmSlots;
  c.goodFarmers = good;
  c.foodMult = foodMult;
  c.farmFood = R((good * 2.4 + (j.farmers - good) * 0.5) * foodMult * low);
  c.gatherFood = R(foragers * 0.6);
  c.extraFood = extraFood;
  c.foodIn = c.farmFood + c.gatherFood + extraFood;
  c.foodOut = R(S.pop + j.soldiers * 0.2);
  c.foodNet = c.foodIn - c.foodOut;
  c.foodAfter = S.res.food + c.foodNet;
  c.storage = 200 + 300 * S.b.granary + 30 * tiles;

  // materials, knowledge, metals
  c.matMult = 1 + (has('copperWorking') ? 0.1 : 0) + (done('tools') ? 0.3 : 0) + 0.15 * S.b.workshop;
  c.matIn = R((j.workers + tileMat) * c.matMult * low);
  c.knowMult = 1 + 0.25 * S.b.scribe + (has('mathematics') ? 0.2 : 0) + (god === 'enki' ? 0.15 : 0) + (S.b.tablets ? 0.25 : 0) + (has('alphabet') ? 0.15 : 0);
  c.know = Math.round((j.scholars + S.pop / 30) * c.knowMult * low * 10) / 10;
  c.copperIn = copperIn;
  c.tinIn = tinIn;
  c.forgeCap = forgeSize() * S.b.forge;
  c.bronzeIn = Math.min(c.forgeCap, Math.floor((S.res.copper + copperIn) / 2), S.res.tin + tinIn);

  // military. Bronze arms need upkeep; an ill-equipped army keeps only half of its bronze edge.
  const arms = Object.keys(PROJECTS).some(k => PROJECTS[k].arms && done(k));
  c.armsUpkeep = arms ? Math.ceil(j.soldiers / ARMS_PER_BRONZE) : 0;
  c.armed = S.res.bronze + c.bronzeIn >= c.armsUpkeep;
  const edge = c.armed ? 1 : 0.5;
  c.weapon = 1 + ((done('weapons') ? 0.6 : 0) + (done('chariots') ? 0.6 : 0)) * edge + (done('iron') ? 0.8 : 0);
  c.armyMult = 1 + 0.2 * S.b.barracks + (has('horses') ? 0.1 : 0) + (god === 'enlil' ? 0.15 : 0);
  c.mercs = buff('army');
  c.strength = R(j.soldiers * c.weapon * c.armyMult + c.mercs);
  c.allyHelp = R(S.ais.filter(a => a.alive && a.ally && !a.war).reduce((s, a) => s + a.army * 0.2, 0));
  c.defMult = 1 + 0.3 * S.b.walls + (done('armour') ? 0.25 * edge : 0) + (done('galleys') ? 0.15 : 0);
  c.defense = R(c.strength * c.defMult + S.pop * 0.04 + S.b.walls * 10 + c.allyHelp);

  c.housing = housing;
  c.tiles = tiles;
  c.coastal = coastal;
  c.foragers = foragers;
  c.harbors = harbors;
  c.pastures = pastures;

  // population next turn
  const room = housing - S.pop;
  const rate = 0.1 * (0.6 + S.stability / 125) * (god === 'inanna' ? 1.2 : 1);
  c.births = (c.foodAfter > 0 && room > 0)
    ? Math.min(Math.max(1, R(S.pop * rate)), room, Math.max(0, Math.floor(c.foodNet * 0.8 + S.res.food * 0.05)))
    : 0;
  c.crowd = S.pop > housing ? Math.ceil((S.pop - housing) * (has('medicine') ? 0.08 : 0.15)) : 0;
  c.starve = c.foodAfter < 0 ? Math.ceil(-c.foodAfter * 0.5) : 0;

  // silver
  const sp = [];
  if (has('weaving') && pastures) sp.push(['Wool from the pastures', 2 * pastures]);
  if (S.b.market) sp.push(['Market dues', 2 + Math.floor(S.pop / 100)]);
  if (has('bureaucracy')) sp.push(['Taxes', 2 + Math.floor(S.pop / 120)]);
  const pacts = S.ais.filter(a => a.alive && a.pact && !a.war);
  if (pacts.length) sp.push(['Trade pacts', 3 * pacts.length]);
  if (S.flags.kanesh) sp.push(['Assyrian caravans', 2]);
  c.tribute = S.vassal && S.turn < S.vassal.until ? S.vassal.silver : 0;
  if (c.tribute) sp.push([`Tribute to ${S.vassal.to}`, -c.tribute]);
  c.silverParts = sp;
  c.silverIn = sp.reduce((a, p) => a + p[1], 0);

  // stability target
  const parts = [['Base', 50]];
  if (S.b.temple) parts.push(['Temples', 8 * S.b.temple]);
  if (has('writing')) parts.push(['Written records', 3]);
  if (has('weaving')) parts.push(['Fine cloth', 2]);
  if (has('literature')) parts.push(['Epics and hymns', 4]);
  if (has('alphabet')) parts.push(['The alphabet', 3]);
  if (has('lawCode')) parts.push(['Law code', 10]);
  if (S.b.market) parts.push(['Market', 3]);
  if (S.b.tombs) parts.push(['Royal tombs', 8]);
  if (S.b.ziggurat) parts.push(['Ziggurat', 15]);
  if (S.b.palace) parts.push(['Royal palace', 5]);
  if (god === 'inanna') parts.push(['Favour of Inanna', 6]);
  if (S.lore) parts.push(['Lore of the ancestors', Math.min(10, S.lore)]);
  const priests = S.pop ? Math.min(8, R(j.scholars / S.pop * 40)) : 0;
  if (priests) parts.push(['Scholars and priests', priests]);
  if (S.pop > housing) parts.push(['Overcrowding', -Math.min(20, R((S.pop - housing) / Math.max(1, housing) * 60))]);
  if (S.pop >= 400) parts.push(['Big-city quarrels', -Math.min(25, Math.floor((S.pop - 300) / 80))]);
  c.landLimit = 5 + (has('lawCode') ? 4 : 0) + (has('bureaucracy') ? 3 : 0) + (S.b.palace ? 3 : 0);
  if (tiles > c.landLimit) parts.push(['Too many lands to govern', -(tiles - c.landLimit) * 3]);
  const wars = S.ais.filter(a => a.alive && a.war).length;
  if (wars) parts.push(['War', -5 * wars]);
  if (c.foodAfter < 0) parts.push(['Hunger', -10]);
  if (c.tribute) parts.push([`Bowing to ${S.vassal.to}`, -3]);
  S.buffs.forEach(b => { if (b.stab) parts.push([b.name, b.stab]); });
  c.stabParts = parts;
  c.stabTarget = clamp(parts.reduce((a, p) => a + p[1], 0), 0, 100);

  // trade
  c.partners = S.ais.filter(a => a.alive && !a.war && a.att >= -20);
  const base = c.partners.length ? 1 + c.partners.length : 0;
  c.caravans = (base + harbors === 0) ? 0 : Math.max(0, base + harbors + 2 * S.b.market + (has('wheel') ? 1 : 0) + (god === 'utu' ? 2 : 0)
    + (has('diplomacy') ? 1 : 0) + pacts.length + (done('galleys') ? 1 : 0) + (S.flags.kanesh ? 1 : 0) + (c.tribute ? 1 : 0)
    - (S.flags.tinClosed ? 1 : 0) + buff('caravan'));
  c.buyMult = (S.b.market ? 1.12 : 1.3) - (god === 'utu' ? 0.06 : 0);
  c.sellMult = (S.b.market ? 0.88 : 0.7) + (god === 'utu' ? 0.06 : 0);
  const dil = aiById('dilmun');
  c.tinDeal = !S.flags.tinClosed && ((dil.alive && !dil.war && dil.att >= 0) || !!S.flags.kanesh);
  c.scarce = S.flags.tinClosed ? { tin: 2.5, copper: 1.6, bronze: 1.5 } : {};

  // cost to settle one more tile
  const k = has('wheel') ? 0.75 : 1;
  c.settle = { pop: 15, food: R(40 * k), materials: R((20 + 5 * (tiles - 1)) * k) };
  return c;
}

const eraOf = () => {
  if (has('bronzeWorking') && S.techs.length >= 20) return 'Late Bronze Age';
  if (has('bronzeWorking') && has('writing')) return 'Middle Bronze Age';
  if (has('bronzeWorking')) return 'Early Bronze Age';
  if (has('copperWorking')) return 'Copper Age';
  return 'Late Neolithic';
};
const titleOf = () => {
  const n = tilesOwnedBy('player').length, p = S.pop;
  if (p >= 2000 && n >= 10) return 'Empire';
  if (p >= 1000 && n >= 6) return 'Kingdom';
  if (p >= 500 && has('writing')) return 'City-state';
  if (p >= 220 && n >= 2) return 'Town';
  if (p >= 110) return 'Chiefdom';
  return 'Tribe';
};

/* ---------- 5. Player actions ---------- */
function canAfford(cost) { return !cost || Object.entries(cost).every(([k, v]) => S.res[k] >= v); }
function pay(cost) { Object.entries(cost || {}).forEach(([k, v]) => { S.res[k] -= v; }); }
function costText(cost) { return Object.entries(cost).filter(([, v]) => v).map(([k, v]) => `${v} ${k}`).join(', '); }
function addBuff(name, turns, fx) { S.buffs.push({ name, turns, ...fx }); }
function earn(n) { if (n > 0) { S.res.silver += n; S.stats.silverEarned += n; } }

function applyFx(fx) {
  for (const [k, v] of Object.entries(fx || {})) {
    if (!v) continue;
    if (k === 'pop') rescalePop(S.pop + v);
    else if (k === 'stability') S.stability = clamp(S.stability + v, 0, 100);
    else if (k === 'knowledge') S.progress += v;
    else if (k === 'silver' && v > 0) earn(v);
    else S.res[k] = Math.max(0, S.res[k] + v);
  }
  if (fx && fx.knowledge) checkResearch().forEach(n => toast(`Mastered ${n}`));
}

const researchCost = id => (id === 'lore' ? loreCost() : TECHS[id].cost);
const allKnown = () => Object.keys(TECHS).every(has);
function checkResearch() {
  const learned = [];
  while (S.research && S.progress >= researchCost(S.research)) {
    S.progress -= researchCost(S.research);
    if (S.research === 'lore') {
      S.lore++;
      learned.push(`${LORE.name}, volume ${S.lore}`);
      log(`Our scholars finished volume ${S.lore} of the ${LORE.name.toLowerCase()}.`, 'good');
      continue;
    }
    const id = S.research, t = TECHS[id];
    S.techs.push(id);
    S.research = allKnown() ? 'lore' : null;
    learned.push(t.name);
    log(`Our scholars mastered ${t.name}. ${t.desc}`, 'good');
    if (id === 'rituals' && !S.deity) pushModal(godModal());
  }
  return learned;
}

function changeJob(key, dir) {
  const c = calc();
  if (dir === '+') {
    const n = Math.min(ui.step, c.foragers);
    if (!n) return toast('Everyone already has a job. Take people from another job first.');
    S.jobs[key] += n;
  } else {
    S.jobs[key] -= Math.min(ui.step, S.jobs[key]);
  }
  Sound.play('tap');
}
// Just enough farmers to feed everyone with a small surplus; everyone else who is not a soldier or scholar labors
function autoFarm() {
  const j = S.jobs, pool = S.pop - j.soldiers - j.scholars;
  const enough = c => c.foodNet >= Math.max(4, R(c.foodOut * 0.05));
  const tryF = f => { j.farmers = f; j.workers = pool - f; return calc(); };
  if (!enough(tryF(pool))) { toast('Even with everyone farming, the food falls short.'); return; }
  let lo = 0, hi = pool;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (enough(tryF(mid))) hi = mid; else lo = mid + 1;
  }
  tryF(lo);
  Sound.play('tap');
  toast(`${lo} farmers feed everyone. The rest work as laborers.`);
}

const buildCost = id => {
  const b = BUILDINGS[id], n = S.b.house;
  const base = id === 'house' ? b.cost + 4 * n + Math.floor(n * n / 8) : b.cost; // each new row of houses costs more
  return { materials: R(base * (has('mathematics') ? 0.9 : 1)), ...(b.bronze ? { bronze: b.bronze } : {}), ...(b.silver ? { silver: b.silver } : {}) };
};
function buildCheck(id) {
  const b = BUILDINGS[id];
  if (b.tech && !has(b.tech)) return `Needs ${TECHS[b.tech].name}`;
  if (S.b[id] >= b.max) return 'Maximum built';
  for (const [k, v] of Object.entries(buildCost(id))) if (S.res[k] < v) return `Needs ${v} ${k}`;
  return '';
}
function build(id) {
  if (buildCheck(id)) return;
  const b = BUILDINGS[id];
  pay(buildCost(id));
  S.b[id]++;
  if (b.wonder) {
    log(`We raised ${b.one}. Its fame will outlast us.`, 'big');
    toast(`${b.name} complete`, 'gold');
    Sound.play('wonder');
  } else {
    log(`Built ${b.one}.`);
    toast(`Built ${b.one}`);
    Sound.play('build');
  }
}

function projectCheck(id) {
  const p = PROJECTS[id];
  if (done(id)) return 'Done';
  if (!has(p.tech)) return `Needs ${TECHS[p.tech].name}`;
  if (S.res.bronze < p.bronze) return `Needs ${p.bronze} bronze`;
  if (S.res.materials < p.materials) return `Needs ${p.materials} materials`;
  return '';
}
function project(id) {
  if (projectCheck(id)) return;
  const p = PROJECTS[id];
  pay({ bronze: p.bronze, materials: p.materials });
  S.proj.push(id);
  log(`Completed: ${p.name}.`, 'good');
  toast(`${p.name} ready`);
  Sound.play('forge');
}

const impCost = k => R(IMPROVEMENTS[k].cost * (has('mathematics') ? 0.9 : 1));
const fitsTile = (k, i) => (IMPROVEMENTS[k].on === 'coast' ? isCoast(i) : IMPROVEMENTS[k].on.includes(S.tiles[i].t));
function improveCheck(k, i) {
  const m = IMPROVEMENTS[k], t = S.tiles[i];
  if (t.owner !== 'player') return 'Not our land';
  if (t.imp) return 'This land already has an improvement';
  if (m.tech && !has(m.tech)) return `Needs ${TECHS[m.tech].name}`;
  if (S.res.materials < impCost(k)) return `Needs ${impCost(k)} materials`;
  return '';
}
function improve(k) {
  const i = ui.sel;
  if (i == null || !fitsTile(k, i) || improveCheck(k, i)) return;
  S.res.materials -= impCost(k);
  S.tiles[i].imp = k;
  log(`Built a ${IMPROVEMENTS[k].name.toLowerCase()}.`);
  toast(`Built a ${IMPROVEMENTS[k].name.toLowerCase()}`);
  Sound.play('build');
}
function dismantle() {
  const i = ui.sel, t = i == null ? null : S.tiles[i];
  if (!t || t.owner !== 'player' || !t.imp) return;
  const m = IMPROVEMENTS[t.imp];
  pushModal({
    sign: 'materials', title: `Dismantle the ${m.name.toLowerCase()}?`,
    body: 'The land will be free for something else. Nothing is refunded.',
    choices: [
      { label: 'Dismantle', danger: true, run: () => { t.imp = null; log(`Dismantled a ${m.name.toLowerCase()}.`); } },
      { label: 'Keep it', ghost: true, cancel: true },
    ],
  });
}

function settleCheck(i, c) {
  const t = S.tiles[i];
  if (t.owner || t.t === 'S') return 'Not available';
  if (!isFrontier(i)) return 'Too far away. Settle land that touches your borders.';
  const s = c.settle;
  if (S.pop - s.pop < 20) return 'Not enough people to spare';
  if (S.res.food < s.food) return `Needs ${s.food} food`;
  if (S.res.materials < s.materials) return `Needs ${s.materials} materials`;
  return '';
}
function settle() {
  const i = ui.sel, c = calc();
  if (i == null || settleCheck(i, c)) return;
  rescalePop(S.pop - c.settle.pop);
  S.res.food -= c.settle.food;
  S.res.materials -= c.settle.materials;
  S.tiles[i].owner = 'player';
  ui.fresh.add(i);
  log(`Families settled new ${TERRAIN[S.tiles[i].t].name.toLowerCase()}.`, 'good');
  toast(c.tiles + 1 > c.landLimit ? 'New land settled. We hold more land than we can easily govern.' : 'New land settled');
  Sound.play('settle');
}

function defenders(i) {
  const t = S.tiles[i], ai = aiById(t.owner);
  const n = Math.max(1, tilesOwnedBy(ai.id).length);
  return R(ai.army / n * TERRAIN[t.t].def * (t.capital ? 1.4 : 1) + 4 + S.turn * 0.8);
}
function outlook(ratio) {
  if (ratio > 1.4) return 'Likely victory';
  if (ratio > 1.05) return 'In our favour';
  if (ratio > 0.85) return 'An even fight';
  if (ratio > 0.6) return 'Risky';
  return 'Hopeless';
}
function attack() {
  const i = ui.sel, t = i == null ? null : S.tiles[i];
  const ai = t && t.owner && t.owner !== 'player' ? aiById(t.owner) : null;
  if (!ai || S.attacked || !isFrontier(i) || !S.jobs.soldiers) return;
  if (!ai.war) {
    pushModal({
      sign: 'army', title: `March on ${ai.name}?`,
      body: `Attacking means war with ${ai.name}.${ai.pact ? ' Our trade pact will be torn up.' : ''} They will raid our borders until one side asks for peace, and the other neighbors will remember it.`,
      choices: [
        { label: 'Declare war and attack', danger: true, run: () => { startWar(ai); battle(i); } },
        { label: 'Hold back', ghost: true, cancel: true },
      ],
    });
    return;
  }
  battle(i);
}
function breakTies(ai) {
  if (ai.pact || ai.ally) log(`Our ${ai.ally ? 'alliance' : 'trade pact'} with ${ai.name} is broken.`, 'bad');
  ai.pact = false;
  ai.ally = false;
}
function startWar(ai) {
  ai.war = true;
  ai.warTurns = 0;
  ai.att = Math.min(ai.att, -50);
  breakTies(ai);
  S.stats.wars++;
  S.ais.forEach(o => { if (o !== ai && o.alive) o.att = clamp(o.att - 3, -100, 100); });
  log(`We declared war on ${ai.name}.`, 'bad');
  Sound.play('war');
}
function battle(i) {
  const c = calc(), t = S.tiles[i], ai = aiById(t.owner), T = TERRAIN[t.t];
  const def = defenders(i);
  const a = c.strength * rand(0.85, 1.15), d = def * rand(0.85, 1.15);
  S.attacked = true;
  let title, body;
  if (a > d) {
    const lost = killSoldiers(S.jobs.soldiers * 0.18 * d / a);
    ai.army = Math.max(0, ai.army - def * 0.7);
    const wasCap = t.capital;
    t.owner = 'player';
    t.capital = false;
    ui.fresh.add(i);
    const loot = 8 + R(S.turn / 4);
    earn(loot);
    S.conquered++;
    S.stats.battlesWon++;
    S.stability = clamp(S.stability + 3, 0, 100);
    addBuff('Conquered land restless', 8, { stab: -5 });
    S.ais.forEach(o => { if (o !== ai && o.alive && !o.war) o.att = clamp(o.att - (o.ally ? 2 : 4), -100, 100); });
    title = `Victory in the ${T.name.toLowerCase()}`;
    body = `Our army took the land from ${ai.name} and lost ${lost} soldiers. We carried off ${loot} shekels of silver. The conquered families will be restless for a while, and the other neighbors watch us warily.`;
    const rest = tilesOwnedBy(ai.id);
    if (!rest.length) {
      ai.alive = false;
      ai.war = false;
      const joined = R(25 + S.turn);
      rescalePop(S.pop + joined);
      body += ` ${ai.name} is no more. ${joined} of their people join us.`;
      log(`${ai.name} fell to the ${S.name}.`, 'big');
      unlock('conqueror');
    } else if (wasCap) {
      S.tiles[rest[0]].capital = true;
      body += ' We captured their capital, and their leaders fled to another town.';
    }
    log(`We took land from ${ai.name}.`, 'good');
    Sound.play('victory');
  } else {
    const lost = killSoldiers(S.jobs.soldiers * 0.35);
    ai.army = Math.max(0, ai.army - a * 0.35);
    S.stability = clamp(S.stability - 5, 0, 100);
    title = 'Our army is driven back';
    body = `${ai.name} held the ${T.name.toLowerCase()}. We lost ${lost} soldiers.`;
    log(`Our attack on ${ai.name} failed.`, 'bad');
    Sound.play('defeat');
  }
  pushModal({ sign: 'army', title, body, choices: [{ label: 'Continue' }] });
}

function setResearch(id) {
  if (id === 'lore') { if (!allKnown()) return; }
  else {
    const t = TECHS[id];
    if (!t || has(id) || !t.req.every(has)) return;
  }
  S.research = id;
  Sound.play('tap');
  checkResearch().forEach(n => toast(`Mastered ${n}`));
}

function godModal() {
  return {
    sign: 'god', title: 'Choose a patron god',
    body: 'The new shrine needs a lord. Whichever god we choose will be honoured above all others in our city, for as long as it stands.',
    choices: [
      ...Object.entries(GODS).map(([id, g]) => ({ label: `${g.name}, ${g.title}`, hint: g.desc, run: () => chooseGod(id) })),
      { label: 'Decide later', ghost: true, cancel: true, hint: 'Choose from the Build tab at any time' },
    ],
  };
}
function chooseGod(id) {
  if (S.deity || !GODS[id] || !has('rituals')) return;
  S.deity = id;
  log(`${GODS[id].name} becomes the lord of our city.`, 'big');
  toast(`${GODS[id].name} watches over us`);
  Sound.play('chime');
}

const festivalCost = () => ({ food: R(S.pop * 0.25 + 20), silver: 10 });
const festivalWait = () => Math.max(0, (S.cool.festival ?? -99) + 5 - S.turn);
function festivalCheck() {
  if (festivalWait()) return `The people will be ready for another festival in ${plural(festivalWait(), 'turn')}`;
  for (const [k, v] of Object.entries(festivalCost())) if (S.res[k] < v) return `Needs ${v} ${k}`;
  return '';
}
function festival() {
  if (festivalCheck()) return;
  pay(festivalCost());
  S.cool.festival = S.turn;
  S.stability = clamp(S.stability + 8, 0, 100);
  log('We held a festival with music, beer and offerings to the gods.', 'good');
  toast('The people feast and sing (+8 stability)');
  Sound.play('festival');
}

const mercPower = () => R(20 + S.turn * 2.5);
const hasMercs = () => S.buffs.some(b => b.army);
function hireMercs() {
  if (S.res.silver < MERC_COST || hasMercs()) return;
  S.res.silver -= MERC_COST;
  addBuff('Mercenaries', 3, { army: mercPower() });
  log(`We hired mercenaries for ${MERC_COST} silver.`);
  toast(`Mercenaries join us (+${mercPower()} army for 3 turns)`);
  Sound.play('war');
}

function gift(arg) {
  const [id, kind] = arg.split(':');
  const ai = aiById(id), [amt, good] = GIFTS[kind];
  if (!ai || !ai.alive || S.res[kind] < amt) return;
  S.res[kind] -= amt;
  ai.att = clamp(ai.att + (ai.war ? good / 2 : good), -100, 100);
  toast(`${ai.name} accepts the gift`);
  Sound.play('coin');
}
function pactCheck(ai) {
  if (!has('writing')) return 'Needs Writing';
  if (ai.war) return 'We are at war';
  if (ai.att < 20) return 'They must be Friendly first';
  if (S.res.silver < PACT_COST) return `Needs ${PACT_COST} silver`;
  return '';
}
function signPact(id) {
  const ai = aiById(id);
  if (!ai || !ai.alive || ai.pact || pactCheck(ai)) return;
  S.res.silver -= PACT_COST;
  ai.pact = true;
  ai.att = clamp(ai.att + 5, -100, 100);
  log(`We sealed a trade pact with ${ai.name}.`, 'good');
  toast(`Trade pact with ${ai.name}: +1 caravan and 3 silver a turn`);
  Sound.play('coin');
}
function allyCheck(ai) {
  if (!has('diplomacy')) return 'Needs Diplomacy';
  if (!ai.pact) return 'Needs a trade pact first';
  if (ai.att < 50) return 'They must be Kin first';
  if (S.res.bronze < ALLY_COST) return `Needs ${ALLY_COST} bronze as a gift`;
  return '';
}
function makeAlliance(id) {
  const ai = aiById(id);
  if (!ai || !ai.alive || ai.ally || allyCheck(ai)) return;
  S.res.bronze -= ALLY_COST;
  ai.ally = true;
  log(`We swore an alliance with ${ai.name} before the gods.`, 'big');
  toast(`Alliance with ${ai.name}`, 'gold');
  Sound.play('chime');
}
function cancelPact(id) {
  const ai = aiById(id);
  if (!ai || !ai.pact) return;
  ai.att = clamp(ai.att - 15, -100, 100);
  log(`We ended our ${ai.ally ? 'alliance and ' : ''}trade pact with ${ai.name}.`, 'bad');
  ai.pact = false;
  ai.ally = false;
}
function askPeace(id) {
  const ai = aiById(id), c = calc();
  if (!ai || !ai.war) return;
  if (ai.att > -35 || ai.army < c.strength * 0.7) {
    makePeace(ai);
    pushModal({ sign: 'foreign', title: `Peace with ${ai.name}`, body: `${ai.name} agrees to end the war. Their envoys swear an oath before the gods of both peoples.`, choices: [{ label: 'Good' }] });
  } else {
    ai.att -= 3;
    toast(`${ai.name} refuses. Send gifts or grow stronger first.`);
  }
}
function makePeace(ai) {
  ai.war = false;
  ai.warTurns = 0;
  ai.att = Math.max(ai.att, -25) + 10;
  log(`Peace with ${ai.name}.`, 'good');
  Sound.play('chime');
}
const canTribute = (ai, c) => ai.alive && !ai.war && !ai.cool && c.strength > ai.army * (S.deity === 'enlil' ? 1.25 : 1.5);
function demandTribute(id) {
  const ai = aiById(id), c = calc();
  if (!ai || !canTribute(ai, c)) return;
  const silver = 10 + R(S.turn / 3);
  earn(silver);
  S.res.food += 40;
  ai.att -= 25;
  ai.cool = 5;
  if (ai.pact) breakTies(ai);
  log(`${ai.name} paid us tribute.`, 'good');
  toast(`${ai.name} pays ${silver} silver and 40 food`);
  Sound.play('coin');
  if (ai.att < -50 && rnd() < 0.5 * D().anger) declareWarOn(ai, `Humiliated, ${ai.name} takes up arms.`);
}

function price(g, side, c) {
  const G = GOODS[g], v = G.lot * G.value * (c.scarce[g] || 1);
  if (side === 'buy') return Math.ceil(v * c.buyMult * (g === 'tin' && c.tinDeal ? 0.8 : 1));
  return Math.max(1, Math.floor(v * c.sellMult));
}
function trade(g, side) {
  const c = calc();
  if (S.tradeUsed >= c.caravans) return;
  const G = GOODS[g], p = price(g, side, c);
  if (side === 'buy') {
    if (S.res.silver < p) return;
    S.res.silver -= p;
    S.res[g] += G.lot;
  } else {
    if (S.res[g] < G.lot) return;
    S.res[g] -= G.lot;
    earn(p);
  }
  S.tradeUsed++;
  Sound.play('coin');
}

// Goals and the achievements that can be earned in the middle of a game
function checkGoals() {
  const c = calc(), newly = [];
  for (const g of GOALS) {
    if (S.goals.includes(g.id) || !g.done(c)) continue;
    S.goals.push(g.id);
    newly.push(g);
    log(`Goal reached: ${g.text}. Reward: ${describe(null, g.reward)}.`, 'good');
    applyFx(g.reward);
  }
  if (newly.length) {
    toast(`Goal reached: ${newly[0].text} (${describe(null, newly[0].reward)})`, 'gold');
    Sound.play('goal');
  }
  if (S.title === 'Empire') unlock('empire');
  if (S.stats.silverEarned >= 1500) unlock('merchant');
  if (allKnown()) unlock('scholar');
  if (wondersBuilt() === WONDERS.length) unlock('builder');
}

/* ---------- 6. End of turn ---------- */
function endTurn() {
  if (!S || S.over || modalOpen) return;
  const c = calc(), rep = [];
  const before = { pop: S.pop, food: S.res.food, owners: S.tiles.map(t => t.owner) };
  ui.fresh = new Set();
  Sound.play('turn');

  // grain
  let food = S.res.food + c.foodNet;
  if (food < 0) {
    const dead = Math.min(S.pop, Math.ceil(-food * 0.5));
    rescalePop(S.pop - dead);
    food = 0;
    S.stability -= 8;
    rep.push(['bad', `Famine: ${dead} people starved.`]);
  } else if (food > c.storage) {
    const lost = R(food - c.storage);
    food = c.storage;
    if (lost >= 10) rep.push(['', `${lost} grain spoiled. Storage holds ${c.storage}; granaries and new lands hold more.`]);
  }
  S.res.food = R(food);

  // materials, metal, bronze
  S.res.materials += c.matIn;
  S.res.copper += c.copperIn;
  S.res.tin += c.tinIn;
  const cast = Math.min(c.forgeCap, Math.floor(S.res.copper / 2), S.res.tin);
  if (cast > 0) {
    S.res.copper -= cast * 2;
    S.res.tin -= cast;
    S.res.bronze += cast;
    S.stats.bronzeCast += cast;
  }
  if (c.armsUpkeep) {
    const paid = Math.min(c.armsUpkeep, S.res.bronze);
    S.res.bronze -= paid;
    if (paid < c.armsUpkeep) rep.push(['bad', 'There was not enough bronze to keep the army equipped. Our soldiers fight with worn and broken weapons.']);
  }

  // silver: income first, then any tribute we owe
  earn(c.silverIn + c.tribute);
  if (c.tribute) {
    if (S.res.silver >= c.tribute) S.res.silver -= c.tribute;
    else {
      const short = c.tribute - S.res.silver, grain = Math.min(S.res.food, short * 8);
      S.res.silver = 0;
      S.res.food -= grain;
      S.stability = clamp(S.stability - 3, 0, 100);
      rep.push(['bad', `We could not pay ${S.vassal.to} in silver, so their collectors took ${grain} grain instead.`]);
    }
  }

  // knowledge
  S.progress += c.know;
  if (!S.research && allKnown()) S.research = 'lore';
  const learned = checkResearch();

  // people
  if (c.births > 0 && S.res.food > 0) rescalePop(S.pop + c.births);
  if (c.crowd > 0) {
    rescalePop(S.pop - c.crowd);
    rep.push(['bad', `Crowding and disease killed ${c.crowd}. Build houses or settle more land.`]);
  }

  // stability drifts toward its target
  const diff = c.stabTarget - S.stability;
  if (diff) S.stability += Math.sign(diff) * Math.max(1, R(Math.abs(diff) * 0.3));
  S.stability = clamp(S.stability, 0, 100);
  if (S.stability < 15 && rnd() < 0.45) revolt(rep);

  S.buffs.forEach(b => { b.turns--; });
  S.buffs = S.buffs.filter(b => b.turns > 0);

  aiTurn(c, rep);

  S.turn++;
  S.attacked = false;
  S.tradeUsed = 0;
  resolveThreats(rep);
  if (S.vassal && S.turn >= S.vassal.until) {
    rep.push(['good', `${S.vassal.to} has fallen, and no one collects tribute from us any more.`]);
    S.vassal = null;
  }
  checkTitles(rep);
  S.tiles.forEach((t, i) => { if (t.owner === 'player' && before.owners[i] !== 'player') ui.fresh.add(i); });
  recordHistory();

  const dPop = S.pop - before.pop, dFood = S.res.food - before.food;
  log(`People ${signed(dPop)}, food ${signed(dFood)}.`);
  rep.forEach(([kind, text]) => log(text, kind));
  if (learned.length) Sound.play('chime');

  if (S.pop <= 5) return gameOver('Your people scatter', `Too few remain to keep the hearths burning. The last families drift to other villages, and the name of the ${S.name} is forgotten.`);
  if (S.stability <= 0) return gameOver('Civil war', `Rival elders raise their own followers. The ${S.name} tear themselves apart.`);
  if (S.turn >= LAST_TURN) {
    checkGoals();
    save();
    renderAll();
    pushModal(collapseModal());
    return;
  }

  const serious = rep.filter(([kind]) => kind === 'bad' || kind === 'big');
  if (serious.length) {
    pushModal({
      sign: 'land', title: `The years to ${fmtYear(S.turn)}`,
      html: `<ul>${rep.map(([kind, text]) => `<li class="${kind === 'bad' ? 'neg' : kind === 'good' ? 'pos' : ''}">${text}</li>`).join('')}</ul>`,
      choices: [{ label: 'Continue' }],
    });
  } else {
    toast(`${fmtYear(S.turn)}: people ${signed(dPop)}, food ${signed(dFood)}${learned.length ? ` · mastered ${learned.join(', ')}` : ''}`);
  }
  if (learned.length && serious.length) toast(`Mastered ${learned.join(', ')}`);
  if (!historyEvent()) maybeEvent();
  checkGoals();
  save();
  renderAll();
}

function recordHistory() {
  const c = calc();
  S.hist.push({ t: S.turn, pop: S.pop, army: c.strength, know: c.know, food: S.res.food, lands: c.tiles, stab: S.stability });
  if (S.hist.length > LAST_TURN + 5) S.hist.shift();
}

function revolt(rep) {
  const lost = R(S.pop * 0.08);
  rescalePop(S.pop - lost);
  const b = loseBuilding();
  S.stability = clamp(S.stability + 10, 0, 100);
  rep.push(['bad', `Revolt! Rioters killed ${lost} people${b ? ` and burned ${b}` : ''}. The anger has cooled a little.`]);
  // a realm that holds more land than it can govern loses its most distant land first
  const c = calc(), ours = tilesOwnedBy('player'), cap = ours.find(i => S.tiles[i].capital) ?? ours[0];
  const far = ours.filter(i => !S.tiles[i].capital).sort((a, b) => hexDist(b, cap) - hexDist(a, cap));
  if (c.tiles > c.landLimit && far.length) {
    const i = far[0], to = neighbors(i).map(j => S.tiles[j].owner).find(o => o && o !== 'player' && aiById(o).alive);
    S.tiles[i].owner = to || null;
    rep.push(['bad', `Our ${TERRAIN[S.tiles[i].t].name.toLowerCase()} broke away from us${to ? ` and joined ${AI_DEF[to].name}` : ''}.`]);
  }
}
function loseBuilding() {
  const ids = Object.keys(S.b).filter(k => S.b[k] > 0 && !BUILDINGS[k].wonder);
  if (!ids.length) return null;
  const k = pick(ids);
  S.b[k]--;
  return BUILDINGS[k].one;
}
function checkTitles(rep) {
  const e = eraOf(), t = titleOf();
  if (e !== S.era) {
    S.era = e;
    rep.push(['big', `A new age begins: the ${e}.`]);
  }
  if (t !== S.title) {
    const up = TITLES.indexOf(t) > TITLES.indexOf(S.title);
    S.title = t;
    S.stats.maxTitle = Math.max(S.stats.maxTitle, TITLES.indexOf(t));
    rep.push([up ? 'good' : 'bad', up ? `Our people have become ${article(t)} ${t.toLowerCase()}.` : `We have fallen back to ${article(t)} ${t.toLowerCase()}.`]);
  }
}

/* ---------- 7. Neighbors ---------- */
// While we pay tribute to a great power, its peace keeps the neighbors from attacking us
const underProtection = () => !!(S.vassal && S.turn < S.vassal.until);

function aiTurn(c, rep) {
  const d = D();
  for (const ai of S.ais) {
    if (!ai.alive) continue;
    const def = AI_DEF[ai.id];
    const n = tilesOwnedBy(ai.id).length;
    // their armies grow with their land, with time (they learn bronze too) and with the difficulty
    const surge = S.flags.amorites && ai.id === 'amurru' ? 1.4 : 1;
    const target = n * (5 + S.turn * 0.5) * def.mil * d.ai * (1 + S.turn / 120) * surge;
    ai.army += (target - ai.army) * (ai.war ? 0.3 : 0.2);
    const nature = def.base + d.mood;
    ai.att += (nature - ai.att) * (has('diplomacy') && ai.att < nature ? 0.12 : 0.06);
    if (ai.pact) ai.att += 0.8;
    const bord = bordersPlayer(ai.id);
    if (bord && !ai.ally) ai.att -= 0.6 * d.anger;
    ai.att = clamp(ai.att, -100, 100);
    if (ai.cool > 0) ai.cool--;

    // grow into empty land, preferring good farmland
    if (rnd() < def.expand * (1 + S.turn / 90) * surge) {
      const opts = frontier(ai.id).filter(i => !S.tiles[i].owner && S.tiles[i].t !== 'S')
        .map(i => [TERRAIN[S.tiles[i].t].farm + rnd() * 20, i])
        .sort((a, b) => b[0] - a[0]);
      if (opts.length) {
        const pk = opts[0][1];
        S.tiles[pk].owner = ai.id;
        if (isFrontier(pk)) rep.push(['', `${ai.name} settled land on our border.`]);
      }
    }

    if (!ai.war) {
      if (bord && !ai.ally && !underProtection() && ai.att < -40 && ai.army > c.defense * 0.8 && rnd() < 0.25 * d.anger) {
        declareWarOn(ai, `${ai.name} has had enough of us.`);
        rep.push(['bad', `${ai.name} declared war.`]);
      }
    } else {
      ai.warTurns++;
      if ((ai.army < c.strength * 0.5 && rnd() < 0.4) || (ai.warTurns > 5 && rnd() < 0.12)) {
        pushModal(peaceModal(ai));
      } else if (bord && rnd() < 0.4) {
        const r = raid(ai, ai.army * rand(0.5, 0.9), c);
        rep.push([r.ok ? 'good' : 'bad', r.line]);
      }
    }
  }
  aiSkirmishes(rep);
}

// Neighbors quarrel among themselves too: now and then one seizes a border land from another
function aiSkirmishes(rep) {
  const alive = S.ais.filter(a => a.alive);
  for (let x = 0; x < alive.length; x++) {
    for (let y = x + 1; y < alive.length; y++) {
      const a = alive[x], b = alive[y];
      if (!a.alive || !b.alive || rnd() > 0.035 || !borders(a.id, b.id)) continue;
      const [att, dfd] = a.army * rand(0.7, 1.3) > b.army * rand(0.7, 1.3) ? [a, b] : [b, a];
      const targets = tilesOwnedBy(dfd.id).filter(i => neighbors(i).some(j => S.tiles[j].owner === att.id));
      if (!targets.length) continue;
      const i = pick(targets), held = defenders(i);
      att.army *= 0.85;
      if (att.army * rand(0.6, 1.1) <= held) { dfd.army *= 0.92; continue; }
      dfd.army *= 0.8;
      const wasCap = S.tiles[i].capital;
      S.tiles[i].owner = att.id;
      S.tiles[i].capital = false;
      const rest = tilesOwnedBy(dfd.id);
      if (!rest.length) {
        dfd.alive = false;
        dfd.war = false;
        dfd.pact = false;
        dfd.ally = false;
        rep.push(['big', `${att.name} has destroyed ${dfd.name}. Only ruins and songs remain of them.`]);
      } else {
        if (wasCap) S.tiles[rest[0]].capital = true;
        rep.push([dfd.ally ? 'bad' : '', `${att.name} seized land from ${dfd.name}${dfd.ally ? ', our ally' : ''}.`]);
      }
    }
  }
}

function raid(ai, power, c) {
  const def = c.defense * rand(0.85, 1.15);
  if (power > def) {
    const food = R(S.res.food * 0.2), mat = R(S.res.materials * 0.15), dead = Math.max(1, R(S.pop * 0.04));
    S.res.food -= food;
    S.res.materials -= mat;
    rescalePop(S.pop - dead);
    S.stability = clamp(S.stability - 6, 0, 100);
    let line = `${ai.name} raiders broke through and carried off ${food} food and ${mat} materials. ${dead} of our people died.`;
    if (ai.war && power > def * 1.6) {
      const cand = tilesOwnedBy('player').filter(i => !S.tiles[i].capital && neighbors(i).some(j => S.tiles[j].owner === ai.id));
      if (cand.length) {
        const i = pick(cand);
        S.tiles[i].owner = ai.id;
        line += ` They seized our ${TERRAIN[S.tiles[i].t].name.toLowerCase()}.`;
      }
    }
    return { ok: false, line };
  }
  ai.army *= 0.85;
  const lost = killSoldiers(S.jobs.soldiers * 0.05);
  S.stability = clamp(S.stability + 2, 0, 100);
  return { ok: true, line: `Our defenders drove off ${ai.name} raiders${lost ? ` (${lost} soldiers fell)` : ''}.` };
}

function declareWarOn(ai, why) {
  ai.war = true;
  ai.warTurns = 0;
  ai.att = Math.min(ai.att, -45);
  breakTies(ai);
  S.stats.wars++;
  log(`${ai.name} declared war on us.`, 'bad');
  Sound.play('war');
  pushModal({
    sign: 'army', title: `${ai.name} declares war`,
    body: `${why} Their army is about ${R10(ai.army)} strong; our defence is ${calc().defense}. Train soldiers, raise walls, hire mercenaries, or send gifts and ask for peace.`,
    choices: [{ label: 'To arms' }],
  });
}
function peaceModal(ai) {
  return {
    sign: 'foreign', title: `${ai.name} asks for peace`, persist: { type: 'peace', arg: ai.id },
    body: `Messengers from ${ai.name} arrive with gifts of dates and ask to end the war.`,
    choices: [
      { label: 'Make peace', hint: 'War weariness ends', run: () => makePeace(ai) },
      { label: 'Fight on', ghost: true, hint: `${ai.name} grows angrier`, run: () => { ai.att -= 5; } },
    ],
  };
}

function maybeEvent() {
  if (S.turn < 2 || rnd() > 0.45) return;
  const c = calc(), bad = D().bad;
  const pool = EVENTS.filter(e => (S.cool[e.id] ?? -99) + 6 <= S.turn && (!e.cond || e.cond(c)));
  const weight = e => e.weight * (e.bad ? bad : 1);
  const total = pool.reduce((a, e) => a + weight(e), 0);
  let x = rnd() * total;
  for (const e of pool) {
    x -= weight(e);
    if (x <= 0) {
      S.cool[e.id] = S.turn;
      pushModal({ ...e.make(c), persist: { type: 'event', arg: e.id }, sfx: 'event' });
      return;
    }
  }
}

      ] };
  } },
];

function historyEvent() {
  const h = HISTORY.find(x => x.turn === S.turn && !S.flags[`h_${x.id}`]);
  if (!h) return false;
  S.flags[`h_${h.id}`] = true;
  pushModal({ ...h.make(calc()), date: fmtYear(h.turn), persist: { type: 'hist', arg: h.id }, sfx: 'gong' });

}

function becomeVassal(to, until, silver) {
  S.vassal = { to, until, silver };
  log(`We bow to ${to} and pay ${silver} silver a turn.`, 'bad');
}
function addThreat(name, turn, power, id) {
  S.threats.push({ name, turn, power, id });
  log(`The army of ${name} is marching on us.`, 'bad');
  Sound.play('war');
}
function resolveThreats(rep) {
  const due = S.threats.filter(t => S.turn >= t.turn);
  S.threats = S.threats.filter(t => S.turn < t.turn);
  for (const t of due) {
    const held = invasion(t.name, t.power, rep);
    if (t.id !== 'akkad') continue;
    if (held) {
      S.fame.push(['Drove back the army of Akkad', 100]);
      unlock('defiant');
    } else {
      becomeVassal('Akkad', 43, 7);
      rep.push(['bad', 'Akkad installs a governor, and we must pay 7 silver a turn.']);
    }
  }
}
// A great army falls on us. Returns true if our defence held.
function invasion(name, power, rep, defMult = 1) {
  const c = calc(), def = c.defense * defMult * rand(0.9, 1.1);
  if (def >= power) {
    S.stability = clamp(S.stability + 6, 0, 100);
    rep.push(['good', `The army of ${name}, about ${R10(power)} strong, broke against our defence of ${R(c.defense * defMult)}. The people cheer in the streets.`]);
    Sound.play('victory');
    return true;
  }
  const food = R(S.res.food * 0.25), mat = R(S.res.materials * 0.2), dead = Math.max(2, R(S.pop * 0.06));
  S.res.food -= food;
  S.res.materials -= mat;
  rescalePop(S.pop - dead);
  killSoldiers(S.jobs.soldiers * 0.3);
  S.stability = clamp(S.stability - 10, 0, 100);
  let line = `The army of ${name} overwhelmed our defence of ${R(c.defense * defMult)}. They burned fields and carried off ${food} food and ${mat} materials; ${dead} of our people died.`;
  if (power > def * 1.5) {
    const cand = tilesOwnedBy('player').filter(i => !S.tiles[i].capital);
    if (cand.length) {
      const i = pick(cand);
      line += ` Our ${TERRAIN[S.tiles[i].t].name.toLowerCase()} was left a burned ruin, and its families fled.`;
      S.tiles[i].owner = null;
      S.tiles[i].imp = null;
    }
  }
  rep.push(['bad', line]);
  Sound.play('defeat');
  return false;
}
function invasionNow(name, power, defMult = 1) {
  const rep = [], held = invasion(name, power, rep, defMult);
  rep.forEach(([kind, text]) => log(text, kind));
  pushModal({ sign: held ? 'king' : 'army', title: held ? 'They are driven back' : 'They broke through', body: rep.map(r => r[1]).join(' '), choices: [{ label: 'Continue' }] });
  return held;
}

/* ---------- 9. End of the game ---------- */
function collapseNeeds(c) {
  return {
    invasion: R((300 + S.pop * 0.45 + c.tiles * 25) * D().invade),
    food: R(S.pop * 0.5),
    stab: 55,
  };
}
function collapseTests(focus) {
  const c = calc(), n = collapseNeeds(c);
  const def = c.defense * (focus === 'walls' ? 1.2 : 1);
  const food = S.res.food * (focus === 'food' ? 1.3 : 1);
  const stab = S.stability + (focus === 'unity' ? 12 : 0);
  return [
    ['The Sea Peoples', `Defence ${R(def)} against about ${n.invasion}`, def >= n.invasion, 0.25],
    ['The great drought', `${R(food)} food stored, ${n.food} needed`, food >= n.food, 0.2],
    ['Unity', `Stability ${R(stab)}, ${n.stab} needed`, stab >= n.stab, 0.15],
  ];
}
const testsHTML = (tests, final) => `<div class="tests">${tests.map(t => `<div><span><b>${t[0]}</b><br><span class="muted small">${t[1]}</span></span><b class="${t[2] ? 'pos' : 'neg'}">${t[2] ? (final ? 'Passed' : 'Ready') : (final ? 'Failed' : 'Short')}</b></div>`).join('')}</div>`;

function collapseModal() {
  return {
    sign: 'foreign', date: `${END_YEAR} BC`, title: 'The Bronze Age Collapse', persist: { type: 'collapse' }, sfx: 'gong',
    body: 'The drought has not broken. The tin roads are closed, Hattusa and Ugarit are ashes, and the Sea Peoples are rowing up the rivers. Every kingdom will now be tested: its walls, its granaries and the loyalty of its people.',
    html: `<h3>Where we stand</h3>${testsHTML(collapseTests(null), false)}<p>Where do you put your last effort?</p>`,
    choices: [
      { label: 'Man the walls', hint: 'Defence +20% for the test', run: () => resolveCollapse('walls') },
      { label: 'Guard the granaries', hint: 'Stored food counts 30% more', run: () => resolveCollapse('food') },
      { label: 'Gather the people at the temples', hint: 'Stability +12 for the test', run: () => resolveCollapse('unity') },
    ],
  };
}
function resolveCollapse(focus) {
  const tests = collapseTests(focus);
  const lossPct = tests.reduce((a, t) => a + (t[2] ? 0 : t[3]), 0);
  const passes = tests.filter(t => t[2]).length;
  rescalePop(S.pop - R(S.pop * lossPct));
  const [title, text] = [
    ['Swept away', `The ${S.name} vanish from the record. Later travellers find only a mound of melted brick.`],
    ['Diminished', `The ${S.name} survive, but only as a shadow of what they were.`],
    ['Shaken but standing', `The ${S.name} lose much, but the city endures into the Iron Age.`],
    ['Unbroken', `While palaces burn across the world, the ${S.name} hold firm and carry the knowledge of the Bronze Age into the next.`],
  ][passes];
  S.over = true;
  log(`The Collapse: ${title.toLowerCase()}.`, 'big');
  const sc = computeScore(passes);
  unlock('survive');
  if (passes === 3) unlock('unbroken');
  if (S.stats.wars === 0) unlock('peace');
  if (S.diff === 'hard') unlock('hard');
  if (sc.rank === RANKS[RANKS.length - 1][1]) unlock('legend');
  recordBest(sc, title);
  Sound.play(passes >= 2 ? 'victory' : 'defeat');
  pushModal({ sign: 'king', title, body: text, html: testsHTML(tests, true) + scoreHTML(sc) + endChart(), choices: endChoices() });
  save();
}
function gameOver(title, text) {
  S.over = true;
  log(title, 'bad');
  const sc = computeScore(0);
  recordBest(sc, title);
  save();
  renderAll();
  Sound.play('defeat');
  pushModal({ sign: 'land', title, body: text, html: scoreHTML(sc) + endChart(), choices: endChoices() });
}
const endChoices = () => [{ label: 'Play again', run: startNew }, { label: 'Look at the map', ghost: true, cancel: true }];

const RANKS = [
  [0, 'A name lost to the sands'],
  [1800, 'Remembered on a few tablets'],
  [3200, 'A city of songs'],
  [4600, 'A kingdom of legend'],
  [6600, 'Light of the Bronze Age'],
];
const rankOf = total => RANKS.filter(r => total >= r[0]).pop()[1];
function computeScore(passes) {
  const c = calc();
  const parts = [
    ['People', R(S.pop * 0.5)],
    ['Lands', c.tiles * 50],
    ['Ideas mastered', (S.techs.length - 1) * 40],
    [LORE.name, S.lore * LORE.score],
    ['Buildings', (totalBuildings() - S.b.house) * 15],
    ['Bronze projects', S.proj.length * 40],
    ['Great works', WONDERS.reduce((a, k) => a + (S.b[k] ? BUILDINGS[k].wonder : 0), 0)],
    ['Stability', S.stability * 2],
    ['Lands conquered', S.conquered * 10],
    ['Goals reached', S.goals.length * GOAL_SCORE],
    ...S.fame,
    ['Collapse tests passed', passes * 300],
  ];
  const raw = parts.reduce((a, p) => a + p[1], 0), mult = D().score;
  const total = R(raw * mult);
  return { parts, raw, mult, total, rank: rankOf(total), passes };
}
function scoreHTML(sc) {
  const rows = sc.parts.filter(p => p[1]).map(([k, v]) => `<span>${escapeHTML(k)}</span><span>${v}</span>`).join('');
  const mult = sc.mult !== 1 ? `<span>${D().name} difficulty</span><span>×${sc.mult}</span>` : '';
  return `<div class="ledger">${rows}${mult}<span class="tot">Score</span><span class="tot">${sc.total}</span></div><p class="rank">${sc.rank}</p>`;
}
function recordBest(sc, outcome) {
  const m = loadMeta();
  m.best.push({ name: S.name, score: sc.total, rank: sc.rank, diff: S.diff, outcome, turn: S.turn, date: new Date().toISOString().slice(0, 10) });
  m.best.sort((a, b) => b.score - a.score);
  m.best.length = Math.min(m.best.length, 10);
  saveMeta(m);
}

// A smooth line through points (Catmull-Rom turned into cubic Béziers)
function smoothPath(pts) {
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let k = 0; k < pts.length - 1; k++) {
    const p0 = pts[k - 1] || pts[k], p1 = pts[k], p2 = pts[k + 1], p3 = pts[k + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}
function renderMap() {
