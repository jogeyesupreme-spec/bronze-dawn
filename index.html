  svg.setAttribute('viewBox', `0 0 ${w.toFixed(0)} ${h.toFixed(0)}`);
  const claimable = new Set(S.over ? [] : frontier('player').filter(i => !S.tiles[i].owner && S.tiles[i].t !== 'S'));
  const centers = S.tiles.map((t, i) => hexCenter(i % COLS, Math.floor(i / COLS)));
  let tilesOut = '', overlay = '';
  S.tiles.forEach((t, i) => {
    const [x, y] = centers[i];
    const label = `${TERRAIN[t.t].name}, ${t.owner ? ownerName(t.owner) : t.t === 'S' ? 'open water' : 'unclaimed'}${t.capital ? ', capital' : ''}${t.imp ? `, ${IMPROVEMENTS[t.imp].name.toLowerCase()}` : ''}${claimable.has(i) ? ', can be settled' : ''}`;
    tilesOut += `<g class="tile" data-act="select" data-arg="${i}" tabindex="0" role="button" aria-label="${escapeHTML(label)}"><title>${escapeHTML(label)}</title>`;
    tilesOut += `<polygon class="hex t-${t.t}" points="${hexPoints(x, y, HEX)}"/>`;
    tilesOut += `<path class="deco deco-${t.t}" transform="translate(${x.toFixed(1)} ${(y + (t.capital ? 6 : 0)).toFixed(1)})" d="${DECO[t.t]}"/>`;
    tilesOut += '</g>';
  });
  // rivers flow over the land but under borders and markers
  let rivers = '';
  RIVERS.forEach(course => {
    const pts = course.map(([c, r]) => hexCenter(c, r));
    pts[0] = [pts[0][0], pts[0][1] - HEX * 0.55];
    const d = smoothPath(pts);
    rivers += `<path class="river-bank" d="${d}"/><path class="river" d="${d}"/><path class="river-glint" d="${d}"/>`;
  });
  // ownership: a light wash and a border only where the owner changes
  S.tiles.forEach((t, i) => {
    if (!t.owner) return;
    const [x, y] = centers[i], oc = `--oc: var(--o-${t.owner})`;
    overlay += `<polygon class="ownfill${ui.fresh.has(i) ? ' fresh' : ''}" style="${oc}" points="${hexPoints(x, y, HEX)}"/>`;
    const enemy = t.owner !== 'player' && aiById(t.owner)?.war;
    let d = '';
    for (let k = 0; k < 6; k++) {
      const n = nbDir(i, k);

      const a = hexCorner(x, y, HEX - 2.6, k), b = hexCorner(x, y, HEX - 2.6, (k + 1) % 6);
      d += `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`;
    }
    if (d) overlay += `<path class="border${enemy ? ' war' : ''}" style="${oc}" d="${d}"/>`;
  });
  S.tiles.forEach((t, i) => {
    const [x, y] = centers[i], oc = t.owner ? `--oc: var(--o-${t.owner})` : '';
    if (claimable.has(i)) overlay += `<polygon class="claim" points="${hexPoints(x, y, HEX - 5)}"/>`;
    if (t.capital) overlay += `<path class="cap" style="${oc}" transform="translate(${x.toFixed(1)} ${(y - 13).toFixed(1)})" d="${ZIGGURAT}"/>`;
    if (t.imp) {

    }
    if (t.owner && t.owner !== 'player' && aiById(t.owner)?.war && isFrontier(i)) {

  });
  svg.innerHTML = tilesOut + rivers + overlay;

      });
    }
  } else if (!t.owner && t.t !== 'S') {
    const why = settleCheck(i, c), s = c.settle;
    const over = !why && c.tiles + 1 > c.landLimit ? `<p class="why">We can govern ${c.landLimit} lands. Each land beyond that costs 3 stability.</p>` : '';
    h += `<div class="item"><div><h4>Settle this land</h4><p class="meta">${s.pop} people, ${s.food} food, ${s.materials} materials</p>${why ? `<p class="why">${why}</p>` : over}</div><button class="btn" data-act="settle" ${why ? 'disabled' : ''}>Settle</button></div>`;
  } else if (t.owner && t.owner !== 'player') {
    const ai = aiById(t.owner), def = defenders(i);
    let why = '';
    if (!isFrontier(i)) why = 'Too far away. We can only attack land on our border.';
    else if (S.attacked) why = 'Our army has already marched this turn.';
    else if (!S.jobs.soldiers) why = 'We have no soldiers.';
    const warn = ai.ally ? `This would betray our ally ${ai.name}.` : ai.war ? '' : `This starts a war with ${ai.name}.`;
    h += `<div class="item"><div><h4>Attack ${ai.name}</h4><p class="meta">Defenders about ${R10(def)} · our army ${c.strength} · ${outlook(c.strength / Math.max(1, def))}</p>${why ? `<p class="why">${why}</p>` : warn ? `<p class="why">${warn}</p>` : ''}</div><button class="btn danger" data-act="attack" ${why ? 'disabled' : ''}>Attack</button></div>`;
  }
  el.innerHTML = h;
}

function tips(c) {
  const t = [];
  if (c.foodAfter < 0) t.push(['bad', 'Famine next turn: the grain will run out. Move people into farming (try Balance farmers).']);
  else if (c.foodNet < 0) t.push(['bad', `We eat ${-c.foodNet} more grain than we grow each turn. The stores last about ${Math.floor(S.res.food / -c.foodNet)} turns.`]);
  if (S.pop > c.housing) t.push(['bad', `Overcrowded: ${S.pop} people, room for ${c.housing}. Build houses or settle land.`]);
  else if (S.pop >= c.housing - 2) t.push(['', `No room to grow (${S.pop}/${c.housing}). Build houses or settle new land.`]);
  if (S.stability < 35) t.push(['bad', `The people are restless (stability ${S.stability}). Temples, festivals, food and peace help.`]);
  S.threats.forEach(th => t.push(['bad', `The army of ${th.name}, about ${R10(th.power)} strong, arrives in ${plural(th.turn - S.turn, 'turn')}. Our defence is ${c.defense}.`]));
  S.ais.forEach(a => {
    if (a.alive && a.war) t.push(['bad', `At war with ${a.name}. Their army is about ${R10(a.army)}; our defence is ${c.defense}.`]);
    else if (a.alive && !a.ally && a.att < -32 && bordersPlayer(a.id) && !underProtection()) t.push(['bad', `${a.name} is close to war with us. Gifts would calm them; walls and soldiers would deter them.`]);
  });
  if (!c.armed) t.push(['bad', `Our bronze arms need ${c.armsUpkeep} bronze a turn and we cannot supply it. The army fights at half its bronze edge.`]);
  if (!S.research && Object.keys(TECHS).some(id => !has(id) && TECHS[id].req.every(has))) t.push(['', 'The scholars have nothing to study. Pick a subject in Research.']);
  if (has('rituals') && !S.deity) t.push(['', 'The shrine has no lord. Choose a patron god in the Build tab.']);
  if (c.tiles > c.landLimit) t.push(['', `We hold ${c.tiles} lands but can govern only ${c.landLimit} without unrest.`]);
  if (S.jobs.farmers > c.farmSlots) t.push(['', `${S.jobs.farmers - c.farmSlots} farmers work poor land. Settle river or plains land, or dig canals.`]);
  if (c.foragers > S.pop * 0.3) t.push(['', `${c.foragers} people have no job and only forage. Give them work.`]);
  if (has('bronzeWorking') && !S.b.forge) t.push(['', 'Build a forge to cast bronze from copper and tin.']);
  else if (S.b.forge && !c.bronzeIn) t.push(['', 'The forges are cold. Each bronze needs 2 copper and 1 tin.']);
  if (S.res.food >= c.storage && c.foodNet > 0) t.push(['', 'The granaries are full and the surplus spoils. Build granaries, or feed more people.']);
  const left = LAST_TURN - S.turn;
  if (left <= 15 && !S.over) t.push(['bad', `The Collapse comes in ${left * YEARS_PER_TURN} years. Prepare strong walls, full granaries and a loyal people.`]);
  t.sort((a, b) => (b[0] === 'bad') - (a[0] === 'bad'));
  return t.length ? t.slice(0, 4) : [['good', 'All is well. End the turn when you are ready.']];
}
function buffText(b) {
  const fx = [b.food ? `food ${pct(b.food)}` : '', b.stab ? `stability ${signed(b.stab)}` : '', b.army ? `army +${b.army}` : '', b.caravan ? `caravans ${signed(b.caravan)}` : ''].filter(Boolean).join(', ');
  return `${escapeHTML(b.name)}${fx ? ` · ${fx}` : ''} · ${plural(b.turns, 'turn')}`;
}
function goalsHTML(list) {
  return `<ul class="goals">${list.map(g => `<li class="${S.goals.includes(g.id) ? 'done' : ''}"><span>${g.text}</span><span class="rw">${describe(null, g.reward)}</span></li>`).join('')}</ul>`;
}
function renderAdvice(c) {
  if (S.over) { $('#advice').innerHTML = `<p class="tip good">${cu('wedge')}<span>The game is over. Start a new one from the Game menu.</span></p>`; return; }
  const buffs = S.buffs.length ? `<div class="buffs">${S.buffs.map(b => `<span class="pill${b.stab < 0 || b.food < 0 || b.caravan < 0 ? ' bad' : ''}">${buffText(b)}</span>`).join('')}</div>` : '';
  const next = GOALS.filter(g => !S.goals.includes(g.id)).slice(0, 2);
  const goals = next.length ? `<p class="h">Goals</p>${goalsHTML(next)}` : '';
  $('#advice').innerHTML = `<p class="h">Advisors</p>` + tips(c).map(([k, text]) => `<p class="tip ${k}">${cu('wedge')}<span>${text}</span></p>`).join('') + buffs + goals;
}

const TABS = [['people', 'People'], ['build', 'Build'], ['research', 'Research'], ['neighbors', 'Neighbors'], ['trade', 'Trade'], ['chronicle', 'Chronicle']];
function renderTabs() {
  const dots = {
    research: !S.research && !S.over && Object.keys(TECHS).some(id => !has(id) && TECHS[id].req.every(has)),
    build: has('rituals') && !S.deity && !S.over,

  $('#tabs').innerHTML = TABS.map(([id, label], k) => `<button class="tab" role="tab" id="tab-${id}" aria-selected="${ui.tab === id}" data-act="tab" data-arg="${id}" title="${label} (${k + 1})">${label}${dots[id] ? '<span class="dot" aria-label="needs attention"></span>' : ''}</button>`).join('');
  $('#pane').setAttribute('aria-labelledby', `tab-${ui.tab}`);
}
function renderPane(c) {
  const fn = { people: paneP, build: paneBuild, research: paneResearch, neighbors: paneNeighbors, trade: paneTrade, chronicle: paneChronicle }[ui.tab];
  $('#pane').innerHTML = fn(c);
}

function paneP(c) {
  const j = S.jobs;
  const outs = {
    farmers: `+${c.farmFood} food · ${c.goodFarmers} of ${c.farmSlots} on good farmland`,
    workers: `+${c.matIn} materials`,
    soldiers: `Army strength ${c.strength}${c.armsUpkeep ? ` · arms use ${c.armsUpkeep} bronze a turn` : ''}`,
    scholars: `+${fmt1(c.know)} knowledge`,
  };
  let h = `<div class="steps"><span class="muted small">Move people in groups of</span>${[1, 5, 10, 25, 100].map(n => `<button class="chipbtn" data-act="step" data-arg="${n}" aria-pressed="${ui.step === n}">${n}</button>`).join('')}</div>`;
  h += '<div class="jobs">' + JOBS.map(job => `<div class="job">${cu(job.sign)}<div class="job-txt"><b>${job.name}</b><span class="muted small">${job.desc}</span><span class="out">${outs[job.key]}</span></div><div class="stepper"><button class="btn sq ghost" data-act="job" data-arg="${job.key}:-" ${j[job.key] && !S.over ? '' : 'disabled'} aria-label="Fewer ${job.name.toLowerCase()}">−</button><span class="n">${j[job.key]}</span><button class="btn sq" data-act="job" data-arg="${job.key}:+" ${c.foragers && !S.over ? '' : 'disabled'} aria-label="More ${job.name.toLowerCase()}">+</button></div></div>`).join('');
  h += `<div class="job">${cu('people')}<div class="job-txt"><b>Foragers</b><span class="muted small">People without a job gather wild food.</span><span class="out">+${c.gatherFood} food</span></div><div class="stepper"><span class="n">${c.foragers}</span></div></div></div>`;
  h += `<div class="row"><button class="btn ghost" data-act="autofarm" ${S.over ? 'disabled' : ''}>Balance farmers</button><span class="muted small">Just enough farmers to feed everyone; the rest become laborers.</span></div>`;
  h += `<p class="h">Grain each turn</p><div class="ledger"><span>Fields</span><span>+${c.farmFood}</span><span>Foraging</span><span>+${c.gatherFood}</span>${c.extraFood ? `<span>Pastures and fishing</span><span>+${c.extraFood}</span>` : ''}<span>Eaten</span><span>−${c.foodOut}</span><span class="tot">Balance</span><span class="tot ${c.foodNet < 0 ? 'neg' : 'pos'}">${signed(c.foodNet)}</span></div>`;
  h += `<p class="h">People next turn</p><div class="ledger"><span>Births</span><span>+${c.births}</span>${c.crowd ? `<span>Deaths from crowding</span><span class="neg">−${c.crowd}</span>` : ''}${c.starve ? `<span>Starvation</span><span class="neg">−${c.starve}</span>` : ''}<span>Housing</span><span>${S.pop} / ${c.housing}</span></div>`;
  h += `<p class="h">Stability ${S.stability} → ${c.stabTarget}</p><div class="ledger">${c.stabParts.map(([k, v]) => `<span>${escapeHTML(k)}</span><span class="${v < 0 ? 'neg' : ''}">${k === 'Base' ? v : signed(v)}</span>`).join('')}</div><p class="muted small">Stability moves part of the way toward its target each turn. Below 30, work slows. Below 15, it slows further, riots break out, and lands beyond what we can govern may break away. At 0 the realm falls into civil war.</p>`;
  const why = S.over ? 'Game over' : festivalCheck(), fc = festivalCost();
  h += `<div class="item"><div><h4>Hold a festival</h4><p class="meta">+8 stability now · ${costText(fc)}</p>${why ? `<p class="why">${why}</p>` : ''}</div><button class="btn" data-act="festival" ${why ? 'disabled' : ''}>Celebrate</button></div>`;
  return h;
}

function paneBuild() {
  let h = '';
  if (has('rituals')) {
    if (S.deity) {
      const g = GODS[S.deity];
      h += `<div class="godbox"><p class="h">Patron god</p><h4>${cu('god')} ${g.name}, ${g.title}</h4><p class="small">${g.desc}</p></div>`;
    } else {
      h += `<div class="godbox"><p class="h">Choose a patron god</p><p class="small">The choice lasts for the whole game.</p>${Object.entries(GODS).map(([id, g]) => `<div class="item"><div><h4>${g.name} <span class="count">${g.title}</span></h4><p class="meta">${g.desc}</p></div><button class="btn" data-act="god" data-arg="${id}" ${S.over ? 'disabled' : ''}>Choose</button></div>`).join('')}</div>`;
    }
  }
  const row = (id, b) => {
    const why = S.over ? 'Game over' : buildCheck(id);
    const locked = b.tech && !has(b.tech), built = b.wonder && S.b[id];
    return `<div class="item${locked ? ' locked' : ''}${b.wonder ? ' wonder' : ''}${built ? ' built' : ''}"><div><h4>${b.name}${b.wonder ? '' : ` <span class="count">${S.b[id]}${b.max < 99 ? ` of ${b.max}` : ''}</span>`}</h4><p class="meta">${b.desc()}${built ? '' : ` · ${costText(buildCost(id))}`}</p>${why && why !== 'Maximum built' ? `<p class="why">${why}</p>` : ''}</div><button class="btn" data-act="build" data-arg="${id}" ${why ? 'disabled' : ''}>${why === 'Maximum built' ? 'Built' : 'Build'}</button></div>`;
  };
  h += '<p class="h">Buildings</p><div>';
  for (const [id, b] of Object.entries(BUILDINGS)) if (!b.wonder) h += row(id, b);
  h += `</div><p class="h">Great works <span class="count">${wondersBuilt()} of ${WONDERS.length}</span></p><div>`;
  for (const id of WONDERS) h += row(id, BUILDINGS[id]);
  h += '</div><p class="h">Bronze projects</p><div>';
  for (const [id, p] of Object.entries(PROJECTS)) {
    const why = S.over ? 'Game over' : projectCheck(id);
    h += `<div class="item${!has(p.tech) ? ' locked' : ''}"><div><h4>${p.name}</h4><p class="meta">${p.desc} · ${costText({ bronze: p.bronze, materials: p.materials })}</p>${p.arms ? `<p class="note">Needs 1 bronze a turn for every ${ARMS_PER_BRONZE} soldiers to stay equipped.</p>` : ''}${why && why !== 'Done' ? `<p class="why">${why}</p>` : ''}</div><button class="btn" data-act="project" data-arg="${id}" ${why ? 'disabled' : ''}>${why === 'Done' ? 'Done' : 'Make'}</button></div>`;
  }
  h += '</div><p class="muted small">Mines, canals, pastures, quarries and harbors go on a single tile. Select land you own on the map to build one.</p>';
  return h;
}

function paneResearch(c) {
  const ids = Object.keys(TECHS).filter(id => !has(id));
  const avail = ids.filter(id => TECHS[id].req.every(has));
  const locked = ids.filter(id => !TECHS[id].req.every(has));
  let h = '<div class="current"><p class="h">Studying</p>';
  if (S.research) {
    const name = S.research === 'lore' ? `${LORE.name}, volume ${S.lore + 1}` : TECHS[S.research].name, cost = researchCost(S.research);
    const p = Math.min(S.progress, cost);
    const turns = c.know > 0 ? Math.ceil((cost - S.progress) / c.know) : '∞';
    h += `<h4>${name}</h4><div class="bar"><i style="width:${(p / cost * 100).toFixed(1)}%"></i></div><p class="muted small">${R(p)} of ${cost} knowledge · about ${turns} turn${turns === 1 ? '' : 's'} at ${fmt1(c.know)} a turn</p>`;
  } else {
    h += `<p>Nothing yet. Pick a subject below.${S.progress >= 1 ? ` ${R(S.progress)} knowledge is saved up and will count toward it.` : ''}</p>`;
  }
  h += `</div><p class="muted small">${S.techs.length - 1} of ${Object.keys(TECHS).length - 1} ideas learned.</p>`;
  if (avail.length) {
    h += '<p class="h">Ready to study</p><div>' + avail.map(id => {
      const t = TECHS[id], on = S.research === id;
      return `<div class="item"><div><h4>${t.name} <span class="count">${t.cost}</span></h4><p class="meta">${t.desc}</p><p class="note">${t.note}</p></div><button class="btn${on ? ' ghost' : ''}" data-act="research" data-arg="${id}" ${on || S.over ? 'disabled' : ''}>${on ? 'Studying' : 'Study'}</button></div>`;
    }).join('') + '</div>';
  }
  if (allKnown()) {
    const on = S.research === 'lore';
    h += `<p class="h">Beyond every idea</p><div class="item"><div><h4>${LORE.name} <span class="count">${loreCost()}</span></h4><p class="meta">${LORE.desc}</p><p class="note">${S.lore} volume${S.lore === 1 ? '' : 's'} written.</p></div><button class="btn${on ? ' ghost' : ''}" data-act="research" data-arg="lore" ${on || S.over ? 'disabled' : ''}>${on ? 'Studying' : 'Study'}</button></div>`;
  }
  if (locked.length) {
    h += '<p class="h">Later</p><div>' + locked.map(id => {
      const t = TECHS[id];
      return `<div class="item locked"><div><h4>${t.name} <span class="count">${t.cost}</span></h4><p class="meta">${t.desc}</p><p class="why">Needs ${t.req.filter(r => !has(r)).map(r => TECHS[r].name).join(' and ')}</p></div></div>`;
    }).join('') + '</div>';
  }
  h += `<p class="h">Known</p><p>${S.techs.map(id => TECHS[id].name).join(' · ')}</p>`;
  return h;
}

function moodOf(att) {
  if (att < -40) return 'Hostile';
  if (att < -10) return 'Wary';
  if (att < 20) return 'Neutral';
  if (att < 50) return 'Friendly';
  return 'Kin';
}
function paneNeighbors(c) {
  const off = S.over ? 'disabled' : '';
  let h = `<p class="muted small">Our army: strength <b>${c.strength}</b>, defence <b>${c.defense}</b>${c.allyHelp ? ` (allies add ${c.allyHelp})` : ''}. Their armies are estimates. A hostile neighbor on our border may declare war when its army outmatches our defence.</p>`;
  h += `<div class="item"><div><h4>Hire mercenaries</h4><p class="meta">+${mercPower()} army for 3 turns · ${MERC_COST} silver</p>${hasMercs() ? '<p class="why">Mercenaries already serve us.</p>' : S.res.silver < MERC_COST ? `<p class="why">Needs ${MERC_COST} silver</p>` : ''}</div><button class="btn" data-act="mercs" ${!hasMercs() && S.res.silver >= MERC_COST && !S.over ? '' : 'disabled'}>Hire</button></div>`;
  if (S.vassal || S.threats.length) {
    h += `<div class="nb threat"><div class="nb-head">${cu('king')}<h4>Great powers</h4></div>`;
    if (S.vassal) h += `<p class="small">We bow to <b>${S.vassal.to}</b> and pay ${S.vassal.silver} silver a turn until ${fmtYear(S.vassal.until)}. While we do, no neighbor dares attack us.</p>`;
    S.threats.forEach(t => { h += `<p class="small neg">The army of ${t.name}, about ${R10(t.power)} strong, arrives in ${plural(t.turn - S.turn, 'turn')} (${fmtYear(t.turn)}). Our defence is ${c.defense}.</p>`; });
    h += '</div>';
  }
  for (const ai of S.ais) {
    const d = AI_DEF[ai.id];
    if (!ai.alive) {
      h += `<div class="nb gone" style="--oc: var(--o-${ai.id})"><div class="nb-head"><span class="sw"></span><h4>${ai.name}</h4><span class="pill">Gone</span></div><p class="muted small">Their towns are ruins or belong to others now.</p></div>`;
      continue;
    }
    const n = tilesOwnedBy(ai.id).length;
    const gifts = Object.entries(GIFTS).map(([k, [amt]]) => `<button class="btn ghost" data-act="gift" data-arg="${ai.id}:${k}" ${S.res[k] >= amt && !S.over ? '' : 'disabled'}>Give ${amt} ${k}</button>`).join('');

    else {
      acts += `<button class="btn ghost" data-act="tribute" data-arg="${ai.id}" ${canTribute(ai, c) && !S.over ? '' : 'disabled'}>Demand tribute</button>`;
      if (!ai.pact) acts += `<button class="btn" data-act="pact" data-arg="${ai.id}" ${!pactCheck(ai) && !S.over ? '' : 'disabled'} title="${escapeHTML(pactCheck(ai) || `+1 caravan and 3 silver a turn. Costs ${PACT_COST} silver.`)}">Trade pact</button>`;
      else {
        if (!ai.ally) acts += `<button class="btn" data-act="ally" data-arg="${ai.id}" ${!allyCheck(ai) && !S.over ? '' : 'disabled'} title="${escapeHTML(allyCheck(ai) || `They will never attack us, and lend a fifth of their army to our defence. Costs ${ALLY_COST} bronze.`)}">Alliance</button>`;
        acts += `<button class="btn ghost" data-act="unpact" data-arg="${ai.id}" ${off}>End pact</button>`;
      }
    }
    const status = ai.war ? '<span class="pill war">At war</span>' : ai.ally ? '<span class="pill gold">Ally</span>' : ai.pact ? '<span class="pill peace">Trade pact</span>' : '<span class="pill peace">At peace</span>';
    let note = '';
    if (!ai.war && !ai.pact) note = pactCheck(ai) === 'Needs Writing' ? 'Trade pacts need Writing and a Friendly neighbor.' : `Trade pacts need them Friendly (mood 20+) and ${PACT_COST} silver.`;
    else if (ai.pact && !ai.ally) note = allyCheck(ai) ? `Alliance: ${allyCheck(ai).toLowerCase()}.` : `An alliance costs ${ALLY_COST} bronze.`;
    if (!ai.war && ai.cool) note += ` They paid tribute recently (${plural(ai.cool, 'turn')} until they can again).`;
    h += `<div class="nb" style="--oc: var(--o-${ai.id})">
      <div class="nb-head"><span class="sw"></span><h4>${ai.name}</h4><span class="muted small">${d.epithet}</span>${status}</div>
      <div class="nb-stats"><span>Mood <b>${moodOf(ai.att)}</b></span><span>Army about <b>${R10(ai.army)}</b></span><span>Lands <b>${n}</b></span><span>${bordersPlayer(ai.id) ? 'Shares our border' : 'No shared border'}</span></div>
      <div class="meter" aria-hidden="true"><i style="left:${((ai.att + 100) / 2).toFixed(1)}%"></i></div>
      <div class="nb-acts">${acts}</div>
      ${note ? `<p class="muted small">${note}</p>` : ''}
    </div>`;
  }
  return h;
}

function paneTrade(c) {
  const left = Math.max(0, c.caravans - S.tradeUsed);
  let h = `<p>Merchants weigh silver in shekels. Each deal sends one caravan.</p><div class="ti-stats"><span>Caravans left <b>${left} of ${c.caravans}</b></span><span>Silver <b>${S.res.silver}</b> shekels</span><span>Income <b>${signed(c.silverIn)}</b> a turn</span></div>`;
  if (!c.caravans) h += '<p class="why">No one will trade with us. Make peace, win friends with gifts, or build a harbor.</p>';
  else h += `<p class="muted small">Trading with ${c.partners.map(a => a.name).join(', ') || 'no neighbors'}${c.harbors ? ', and ships from distant ports' : ''}.${c.tinDeal ? ' We buy tin at a discount.' : ''}${S.flags.tinClosed ? ' <span class="neg">The tin roads are closed: metal is scarce and dear.</span>' : ''}</p>`;
  h += '<div class="scroll"><table class="trade"><thead><tr><th>Goods</th><th>Lot</th><th>Buy</th><th>Sell</th><th><span class="muted">Deal</span></th></tr></thead><tbody>';
  for (const [g, G] of Object.entries(GOODS)) {
    const buy = price(g, 'buy', c), sell = price(g, 'sell', c), ok = left && !S.over;
    h += `<tr><td>${cu(g)}${G.name} <span class="muted small">(have ${S.res[g]})</span></td><td>${G.lot}</td><td>${buy}</td><td>${sell}</td><td><div class="acts"><button class="btn" data-act="buy" data-arg="${g}" ${ok && S.res.silver >= buy ? '' : 'disabled'}>Buy</button><button class="btn ghost" data-act="sell" data-arg="${g}" ${ok && S.res[g] >= G.lot ? '' : 'disabled'}>Sell</button></div></td></tr>`;
  }
  h += '</tbody></table></div>';
  if (c.silverParts.length) h += `<p class="h">Silver each turn</p><div class="ledger">${c.silverParts.map(([k, v]) => `<span>${k}</span><span class="${v < 0 ? 'neg' : ''}">${signed(v)}</span>`).join('')}<span class="tot">Balance</span><span class="tot">${signed(c.silverIn)}</span></div>`;
  h += '<p class="muted small">Prices are shekels per lot. A market, peace, trade pacts and friendly neighbors make trade easier. Weaving, markets and taxes bring in silver every turn.</p>';
  return h;
}

// History: one small chart per measure, each on its own scale (never two scales on one chart)
const CHARTS = [['pop', 'People'], ['army', 'Army strength'], ['know', 'Knowledge a turn'], ['food', 'Food stored'], ['lands', 'Lands'], ['stab', 'Stability']];
const CW = 260, CH = 92, CL = 34, CR = 8, CT = 8, CB = 20;
const niceMax = v => { const p = 10 ** Math.floor(Math.log10(v)), m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; };
const chartX = t => CL + t / LAST_TURN * (CW - CL - CR);
function miniChart(key, label) {
  const data = S.hist;
  const last = data.length ? data[data.length - 1][key] : 0;
  const top = key === 'stab' ? 100 : niceMax(Math.max(1, ...data.map(d => d[key])));
  const y = v => CT + (1 - v / top) * (CH - CT - CB);
  let g = '';
  (Number.isInteger(top / 2) ? [0, top / 2, top] : [0, top]).forEach(v => {
    g += `<line class="grid" x1="${CL}" x2="${CW - CR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="axis" x="${CL - 5}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${v >= 1000 ? `${fmt1(v / 1000)}k` : R(v)}</text>`;
  });
  g += `<text class="axis" x="${CL}" y="${CH - 4}">${START_YEAR} BC</text><text class="axis" x="${CW - CR}" y="${CH - 4}" text-anchor="end">${END_YEAR} BC</text>`;
  const line = data.length > 1 ? `<path class="ln" stroke="${CHART_LINE}" d="M${data.map(d => `${chartX(d.t).toFixed(1)} ${y(d[key]).toFixed(1)}`).join(' L')}"/>` : '';
  const shown = key === 'know' ? fmt1(last) : last;
  return `<figure class="mini"><figcaption><span class="h">${label}</span><b>${shown}</b></figcaption>
    <svg class="chart" viewBox="0 0 ${CW} ${CH}" data-chart="${key}" data-top="${top}" tabindex="0" role="img" aria-label="${label} by year. Latest: ${shown}. Use the arrow keys to read earlier years.">${g}${line}
    <line class="xhair" stroke="var(--muted)" stroke-width="1" y1="${CT}" y2="${CH - CB}" visibility="hidden"/><circle class="xdot" r="4" fill="${CHART_LINE}" stroke="var(--panel)" stroke-width="2" visibility="hidden"/></svg>
    <div class="ctip" hidden><b></b> <span class="muted"></span></div></figure>`;
}
function historyHTML() {
  if (S.hist.length < 2) return '<p class="muted small">The scribes have only begun to keep count. Charts appear after the first turn.</p>';
  let h = `<div class="minis">${CHARTS.map(([k, l]) => miniChart(k, l)).join('')}</div>`;
  const rows = S.hist.filter((d, k) => d.t % 5 === 0 || k === S.hist.length - 1);
  h += `<details><summary class="small muted">Show the numbers as a table</summary><div class="scroll"><table class="best"><thead><tr><th>Year</th>${CHARTS.map(([, l]) => `<th>${l}</th>`).join('')}</tr></thead><tbody>${rows.map(d => `<tr><td>${fmtYear(d.t)}</td>${CHARTS.map(([k]) => `<td>${k === 'know' ? fmt1(d[k]) : d[k]}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
  return h;
}
// The crosshair snaps to the nearest recorded year; the readout shows the value first, then the year
function chartPoint(svg, idx) {
  const key = svg.dataset.chart, data = S.hist, d = data[clamp(idx, 0, data.length - 1)];
  if (!d) return;
  svg.dataset.idx = data.indexOf(d);
  const top = +svg.dataset.top, x = chartX(d.t), y = CT + (1 - d[key] / top) * (CH - CT - CB);
  const xh = svg.querySelector('.xhair'), dot = svg.querySelector('.xdot');
  xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
  dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('visibility', 'visible');
  const tip = svg.parentNode.querySelector('.ctip');
  tip.querySelector('b').textContent = key === 'know' ? fmt1(d[key]) : d[key];
  tip.querySelector('span').textContent = fmtYear(d.t);
  tip.hidden = false;
  const box = svg.getBoundingClientRect(), px = x / CW * box.width;
  tip.style.left = `${clamp(px - tip.offsetWidth / 2, 0, box.width - tip.offsetWidth)}px`;
}
function chartHide(svg) {
  svg.querySelector('.xhair').setAttribute('visibility', 'hidden');
  svg.querySelector('.xdot').setAttribute('visibility', 'hidden');
  svg.parentNode.querySelector('.ctip').hidden = true;
}
function endChart() {
  return S.hist.length > 1 ? `<h3>The ${escapeHTML(S.name)} through the age</h3>${miniChart('pop', 'People')}` : '';
}

/* ---------- 11. Modals ---------- */
const NAMES = { food: 'food', materials: 'materials', copper: 'copper', tin: 'tin', bronze: 'bronze', silver: 'silver', pop: 'people', stability: 'stability', knowledge: 'knowledge' };
function describe(cost, fx) {
  const parts = [];
  Object.entries(cost || {}).forEach(([k, v]) => parts.push(`−${v} ${NAMES[k]}`));
  Object.entries(fx || {}).forEach(([k, v]) => { if (v) parts.push(`${signed(v)} ${NAMES[k]}`); });
  return parts.join(', ');
}
// Decisions that must survive a reload carry `persist`; they are kept in S.pending until answered
function pushModal(m) {
  if (m.persist && S && !S.pending.includes(m.persist)) S.pending.push(m.persist);
  modalQueue.push(m);
  if (!modalOpen) nextModal();
}
function nextModal() {
  currentModal = modalQueue.shift() || null;
  const box = $('#modal');
  if (!currentModal) { modalOpen = false; box.hidden = true; return; }
  modalOpen = true;
  drawModal(currentModal);
  box.hidden = false;
  if (currentModal.sfx) Sound.play(currentModal.sfx);
  const focusEl = $('#mCard input') || $('#mCard .choice:not(:disabled)');
  if (focusEl) focusEl.focus();
}
function drawModal(m) {
  const choices = m.choices.map((ch, k) => {
    const ok = canAfford(ch.cost);
    let hint = ch.hint ?? describe(ch.cost, ch.fx);
    if (!ok) hint = `Not enough: ${describe(ch.cost)}`;
    return `<button class="btn choice${ch.ghost ? ' ghost' : ''}${ch.danger ? ' danger' : ''}" data-act="choose" data-arg="${k}" ${ok ? '' : 'disabled'}><span>${ch.label}</span>${hint ? `<span class="hint">${hint}</span>` : ''}</button>`;
  }).join('');
  const html = typeof m.html === 'function' ? m.html() : (m.html || '');
  $('#mCard').innerHTML = `${m.sign ? `<div class="bigcu cu" aria-hidden="true">${SIGN[m.sign]}</div>` : ''}${m.date ? `<p class="date">${m.date}</p>` : ''}<h2 id="mTitle">${m.title}</h2>${m.body ? `<p>${m.body}</p>` : ''}${html}<div class="choices">${choices}</div>`;
}
function choose(k) {
  const m = currentModal, ch = m && m.choices[k];
  if (!ch || !canAfford(ch.cost)) return;
  if (m.persist) S.pending = S.pending.filter(p => p !== m.persist);
  pay(ch.cost);
  if (ch.fx) applyFx(ch.fx);
  if (ch.run) ch.run();
  nextModal();
  if (!S.over) checkGoals();
  save();
  renderAll();
}
// Rebuild unanswered decisions after a reload
const REBUILD = {
  event: id => { const e = EVENTS.find(x => x.id === id), c = calc(); return e && (!e.cond || e.cond(c)) ? { ...e.make(c), sfx: 'event' } : null; },
  hist: id => { const h = HISTORY.find(x => x.id === id); return h ? { ...h.make(calc()), date: fmtYear(h.turn), sfx: 'gong' } : null; },
  peace: id => { const ai = aiById(id); return ai && ai.alive && ai.war ? peaceModal(ai) : null; },
  collapse: () => (S.turn >= LAST_TURN ? collapseModal() : null),
};
function restorePending() {
  const list = S.pending;
  S.pending = [];
  list.forEach(p => {
    const m = REBUILD[p.type] && REBUILD[p.type](p.arg);
    if (m) pushModal({ ...m, persist: p });
  });
  if (S.turn >= LAST_TURN && !S.over && !S.pending.some(p => p.type === 'collapse')) pushModal(collapseModal());
}

// Save codes: the game as base64 JSON, so it can be copied to another browser or kept safe
const saveCode = () => `BD2:${btoa(unescape(encodeURIComponent(JSON.stringify(S))))}`;
function readSave(text) {
  try {
    const t = String(text).trim();
    const json = t.startsWith('{') ? t : decodeURIComponent(escape(atob(t.replace(/^BD\d*:/, '').replace(/\s+/g, ''))));
    return migrate(JSON.parse(json));
  } catch (e) { return null; }
}
function importSave(text) {
  const s = readSave(text);
  if (!s) { toast('That is not a Bronze Dawn save.'); return; }
  S = s;
  S.era = eraOf();
  S.title = TITLES.includes(S.title) ? S.title : titleOf();
  if (!S.hist.length) recordHistory();
  modalQueue = [];
  nextModal();
  ui.sel = tilesOwnedBy('player').find(i => S.tiles[i].capital) ?? tilesOwnedBy('player')[0] ?? null;
  ui.fresh = new Set();
  save();
  renderAll();
  restorePending();
  toast(`Loaded the ${S.name}, ${fmtYear(S.turn)}`);
}
function copySave() {
  const ta = $('#saveCode');
  if (!ta) return;
  const done = () => toast('Save code copied');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); document.execCommand('copy'); done(); });
  else { ta.select(); document.execCommand('copy'); done(); }
}
function downloadSave() {
  const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `bronze-dawn-${S.name.toLowerCase().replace(/[^a-z0-9]+/g, '-') || 'game'}-${yearOf(S.turn)}bc.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- 12. Sound ---------- */
// Everything is synthesised with Web Audio: no files to load. Lyre plucks, drums, bells and a soft drone.
const SCALE = [293.66, 329.63, 349.23, 392, 440, 466.16, 523.25, 587.33, 659.25, 698.46, 783.99, 880];
const PENTA = [146.83, 174.61, 196, 220, 261.63, 293.66, 349.23, 392, 440];
const Sound = {
  set: { sound: true, music: false },
  ctx: null, out: null, musicBus: null, nbuf: null, drone: null, timer: 0, nextNote: 0, step: 3,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { this.ctx = new AC(); } catch (e) { return false; }
    const comp = this.ctx.createDynamicsCompressor();
    comp.connect(this.ctx.destination);
    this.out = this.ctx.createGain();
    this.out.gain.value = 0.55;
    this.out.connect(comp);
    this.musicBus = this.ctx.createGain();
    this.musicBus.gain.value = 0;
    this.musicBus.connect(comp);
    return true;
  },
  tone(f, t, dur, { type = 'triangle', vol = 0.18, a = 0.005, f2 = 0, bus = null } = {}) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(bus || this.out);
    o.start(t);
    o.stop(t + dur + 0.05);
  },
  noise(t, dur, { vol = 0.15, freq = 1200, q = 0.8, f2 = 0 } = {}) {
    const ctx = this.ctx;
    if (!this.nbuf) {
      this.nbuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = this.nbuf.getChannelData(0);
      for (let k = 0; k < d.length; k++) d[k] = Math.random() * 2 - 1;
    }
    const src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = this.nbuf;
    fl.type = 'bandpass';
    fl.frequency.setValueAtTime(freq, t);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    fl.Q.value = q;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(fl);
    fl.connect(g);
    g.connect(this.out);
    src.start(t);
    src.stop(t + dur + 0.05);
  },
  pluck(f, t, vol = 0.16, bus = null) {
    this.tone(f, t, 1.2, { type: 'triangle', vol, a: 0.003, bus });
    this.tone(f * 2, t, 0.45, { type: 'sine', vol: vol * 0.35, a: 0.003, bus });
  },
  drum(t, vol = 0.5, f = 110) {
    this.tone(f, t, 0.35, { type: 'sine', vol, a: 0.002, f2: f * 0.45 });
    this.noise(t, 0.08, { vol: vol * 0.25, freq: 900 });
  },
  bell(f, t, vol = 0.12) {
    [1, 2.76, 5.4].forEach((m, k) => this.tone(f * m, t, 1.6 / (k + 1), { type: 'sine', vol: vol / (k + 1), a: 0.002 }));
  },
  play(name) {
    if (!this.set.sound || !this.init()) return;
    const t = this.ctx.currentTime + 0.02, N = SCALE;
    switch (name) {
      case 'tap': this.tone(660, t, 0.06, { type: 'sine', vol: 0.04 }); break;
      case 'build': this.drum(t, 0.25, 180); this.drum(t + 0.12, 0.2, 150); this.noise(t, 0.12, { vol: 0.08, freq: 500 }); break;
      case 'settle': [0, 2, 4].forEach((k, n) => this.pluck(N[k], t + n * 0.1)); break;
      case 'chime': this.bell(880, t); this.bell(1320, t + 0.15, 0.08); break;
      case 'coin': this.tone(2400, t, 0.12, { type: 'square', vol: 0.025 }); this.tone(3200, t + 0.06, 0.18, { type: 'square', vol: 0.02 }); break;
      case 'forge': [0, 0.18, 0.36].forEach(d => { this.tone(1800, t + d, 0.25, { type: 'square', vol: 0.025 }); this.noise(t + d, 0.06, { vol: 0.1, freq: 3000 }); }); break;
      case 'war': [0, 0.22, 0.44, 0.58].forEach((d, k) => this.drum(t + d, 0.45, k === 3 ? 70 : 90)); break;
      case 'victory': [0, 2, 4, 7].forEach((k, n) => this.pluck(N[k], t + n * 0.12, 0.18)); break;
      case 'defeat': [4, 3, 1, 0].forEach((k, n) => this.pluck(N[k] / 2, t + n * 0.18, 0.16)); break;
      case 'event': this.pluck(N[0], t, 0.12); this.pluck(N[4], t + 0.08, 0.1); break;
      case 'gong':
        this.tone(98, t, 3.5, { type: 'sine', vol: 0.25, a: 0.01 });
        this.tone(98 * 2.4, t, 2.2, { type: 'sine', vol: 0.08 });
        this.tone(98 * 3.9, t, 1.4, { type: 'sine', vol: 0.05 });
        this.noise(t, 0.4, { vol: 0.05, freq: 300 });
        break;
      case 'turn': this.noise(t, 0.5, { vol: 0.05, freq: 400, f2: 1600 }); this.drum(t + 0.05, 0.16, 120); break;
      case 'goal': [4, 7, 9].forEach((k, n) => this.bell(N[k], t + n * 0.09, 0.07)); break;
      case 'wonder':
        [0, 4, 7, 9, 11].forEach((k, n) => this.pluck(N[k], t + n * 0.1, 0.17));
        this.tone(N[0] / 2, t, 2.5, { type: 'sine', vol: 0.12, a: 0.05 });
        break;
      case 'festival':
        [0, 4, 2, 5, 4, 7].forEach((k, n) => this.pluck(N[k], t + n * 0.11, 0.14));
        this.drum(t, 0.25, 140);
        this.drum(t + 0.33, 0.25, 140);
        break;
      default: break;
    }
  },
  // Music: a low drone and lyre notes wandering a pentatonic scale
  music(on) {
    if (!on || !this.set.sound) {
      if (this.ctx) this.musicBus.gain.setTargetAtTime(0, this.ctx.currentTime, 0.4);
      clearInterval(this.timer);
      this.timer = 0;
      if (this.drone) {
        const t = this.ctx.currentTime;
        this.drone.forEach(o => o.stop(t + 1.5));
        this.drone = null;
      }
      return;
    }
    if (this.timer || !this.init()) return;
    const ctx = this.ctx, lp = ctx.createBiquadFilter(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
    lp.type = 'lowpass';
    lp.frequency.value = 420;
    g.gain.value = 0.035;
    lfo.frequency.value = 0.07;
    lg.gain.value = 160;
    lfo.connect(lg);
    lg.connect(lp.frequency);
    const oscs = [73.42, 110, 73.6].map(f => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(lp); return o; });
    lp.connect(g);
    g.connect(this.musicBus);
    this.drone = [...oscs, lfo];
    this.drone.forEach(o => o.start());
    this.musicBus.gain.setTargetAtTime(0.9, ctx.currentTime, 0.8);
    this.nextNote = ctx.currentTime + 0.6;
    this.timer = setInterval(() => this.schedule(), 200);
  },
  schedule() {
    if (!this.ctx || document.hidden) return;
    const now = this.ctx.currentTime;
    if (this.nextNote < now) this.nextNote = now + 0.1;
    while (this.nextNote < now + 0.6) {
      this.step = clamp(this.step + Math.floor(Math.random() * 5) - 2, 0, PENTA.length - 1);
      this.pluck(PENTA[this.step], this.nextNote, 0.07, this.musicBus);
      if (Math.random() < 0.25) this.pluck(PENTA[Math.max(0, this.step - 2)], this.nextNote + 0.02, 0.05, this.musicBus);
      this.nextNote += [0.45, 0.6, 0.9, 1.2, 1.8][Math.floor(Math.random() * 5)];
    }
  },
};
function toggleSound() {
  Sound.set.sound = !Sound.set.sound;
  saveSettings();
  Sound.music(Sound.set.music);
  Sound.play('tap');
  renderSoundBtn();
  if (modalOpen && currentModal.menu) drawModal(currentModal);
}
function toggleMusic() {
  Sound.set.music = !Sound.set.music;
  if (Sound.set.music && !Sound.set.sound) Sound.set.sound = true;
  saveSettings();
  Sound.music(Sound.set.music);
  renderSoundBtn();
  if (modalOpen && currentModal.menu) drawModal(currentModal);
}

/* ---------- 13. Boot ---------- */
const ACTIONS = {
  select: (i, viaKey) => {
    ui.sel = +i;
    renderAll();
    if (viaKey) document.querySelector(`.tile[data-arg="${i}"]`)?.focus();
  },
  tab: id => { ui.tab = id; Sound.play('tap'); },
  step: n => { ui.step = +n; },
  job: arg => { const [k, d] = arg.split(':'); changeJob(k, d); },
  autofarm: autoFarm,
  build, project, improve, settle, attack, dismantle,
  research: setResearch,
  god: chooseGod,
  festival,
  mercs: hireMercs,
  gift,
  peace: askPeace,
  tribute: demandTribute,
  pact: signPact,
  ally: makeAlliance,
  unpact: cancelPact,
  buy: g => trade(g, 'buy'),
  sell: g => trade(g, 'sell'),
  end: endTurn,
  choose: k => choose(+k),
  help: showHelp,
  menu: () => pushModal(menuModal()),
  sound: toggleSound,
  music: toggleMusic,
  diff: id => {
    if (!DIFFS[id]) return;
    ui.diff = id;
    document.querySelectorAll('[data-act="diff"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.arg === id)));
    Sound.play('tap');
  },
  copysave: copySave,
  download: downloadSave,
  loadsave: () => importSave(($('#loadCode') || {}).value || ''),
};
// actions that render (and save) on their own
const SELF_RENDER = new Set(['select', 'end', 'choose', 'help', 'menu', 'dismantle', 'sound', 'music', 'diff', 'copysave', 'download', 'loadsave']);
// actions allowed while a dialog is open
const MODAL_OK = new Set(['choose', 'sound', 'music', 'diff', 'copysave', 'download', 'loadsave']);

function nearestHist(svg, clientX) {
  const box = svg.getBoundingClientRect(), vx = (clientX - box.left) / box.width * CW;
  const t = (vx - CL) / (CW - CL - CR) * LAST_TURN;
  let best = 0;
  S.hist.forEach((d, k) => { if (Math.abs(d.t - t) < Math.abs(S.hist[best].t - t)) best = k; });
  return best;
}
function bindEvents() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled || !S) return;
    const act = el.dataset.act;
    if (modalOpen && !MODAL_OK.has(act)) return;
    if (!ACTIONS[act]) return;
    ACTIONS[act](el.dataset.arg);
    if (!SELF_RENDER.has(act)) { if (!S.over) checkGoals(); save(); renderAll(); }
  });
  document.addEventListener('change', e => {
    if (e.target.id !== 'loadFile' || !e.target.files || !e.target.files[0]) return;
    e.target.files[0].text().then(importSave, () => toast('Could not read that file.'));
  });
  document.addEventListener('keydown', e => {
    if (!S) return;
    if (e.target.id === 'peopleName' && e.key === 'Enter') { e.preventDefault(); choose(0); return; }
    if (e.key === 'Escape' && modalOpen) {
      const k = currentModal.choices.findIndex(ch => ch.cancel);
      if (k >= 0) { e.preventDefault(); choose(k); }
      return;
    }
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
    const chart = e.target.closest && e.target.closest('svg[data-chart]');
    if (chart && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      e.preventDefault();
      const idx = chart.dataset.idx == null ? S.hist.length - 1 : +chart.dataset.idx;
      chartPoint(chart, idx + (e.key === 'ArrowLeft' ? -1 : 1));
      return;
    }
    const tile = e.target.closest && e.target.closest('.tile');
    if (tile && !modalOpen) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ACTIONS.select(tile.dataset.arg, true); return; }
      if (e.key.startsWith('Arrow')) {
        const i = +tile.dataset.arg, odd = Math.floor(i / COLS) & 1;
        const n = nbDir(i, { ArrowRight: 0, ArrowLeft: 3, ArrowUp: odd ? 4 : 5, ArrowDown: odd ? 2 : 1 }[e.key]);
        e.preventDefault();
        if (n >= 0) ACTIONS.select(n, true);
        return;
      }
    }
    if (modalOpen) return;
    if (e.key === 'e' || e.key === 'E') endTurn();
    else if (/^[1-6]$/.test(e.key)) { ui.tab = TABS[+e.key - 1][0]; renderAll(); }
    else if (e.key === '?') showHelp();
    else if (e.key === 'm' || e.key === 'M') toggleSound();
  });
  // history charts: a crosshair that follows the pointer, and the same readout on keyboard focus
  document.addEventListener('pointermove', e => {
    const svg = e.target.closest && e.target.closest('svg[data-chart]');
    if (svg && S.hist.length) chartPoint(svg, nearestHist(svg, e.clientX));
  });
  document.addEventListener('pointerout', e => {
    const svg = e.target.closest && e.target.closest('svg[data-chart]');
    if (svg && !svg.contains(e.relatedTarget)) chartHide(svg);
  });
  document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('svg[data-chart]') && S.hist.length) chartPoint(e.target, S.hist.length - 1); });
  document.addEventListener('focusout', e => { if (e.target.matches && e.target.matches('svg[data-chart]')) chartHide(e.target); });
}

function start(data) {
  Sound.set = loadSettings();
  bindEvents();
  const saved = (data && data.save && migrate(data.save)) || loadSave();
  if (saved && !saved.over) {
    S = saved;
    S.era = eraOf();
    S.title = TITLES.includes(S.title) ? S.title : titleOf();
    if (!S.hist.length) recordHistory();
    ui.sel = tilesOwnedBy('player').find(i => S.tiles[i].capital) ?? tilesOwnedBy('player')[0] ?? null;
    renderAll();
    restorePending();
  } else {
    newGame('Uruma');
    renderAll();
    showIntro();
  }
  // browsers only allow sound after the first touch or click
  if (Sound.set.music) document.addEventListener('pointerdown', () => Sound.music(true), { once: true });
}

window.claude?.hot?.snapshot?.(() => ({ save: S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
